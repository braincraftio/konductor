<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konductor Terminal</title>
    <!-- JetBrainsMono Nerd Font Mono, embedded at build time by
         default.nix. Airgap-safe: no CDN fetches. -->
    @konductorEmbeddedFonts@
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* =======================================================================
       * Status bar chrome — uses CSS custom properties set by JS after
       * restty loads the builtin theme.  Fallback values are neutral dark
       * tones so the page renders acceptably before JS executes.
       * ======================================================================= */
      :root {
        --bg: #1e1e2e;
        --bg-alt: #181825;
        --border: #313244;
        --text: #cdd6f4;
        --text-dim: #a6adc8;
        --green: #a6e3a1;
        --yellow: #f9e2af;
        --red: #f38ba8;
        --muted: #6c7086;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }

      .container {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 16px;
        background: var(--bg-alt);
        border-bottom: 1px solid var(--border);
      }

      .title {
        color: var(--text);
        font-size: 14px;
        font-weight: 500;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--text-dim);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }

      .status-dot.connected {
        background: var(--green);
      }

      .status-dot.connecting {
        background: var(--yellow);
        animation: pulse 1s infinite;
      }

      .status-dot.disconnected {
        background: var(--red);
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      #terminal {
        flex: 1;
        overflow: hidden;
      }

      #terminal canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title">Konductor Terminal</div>
        <div class="status">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Connecting...</span>
        </div>
      </div>
      <div id="terminal"></div>
    </div>

    <script type="module">
      // =========================================================================
      // Restty Web Terminal - Konductor Frontend
      // =========================================================================
      // Uses restty native API (NOT xterm compat shim) for full WebGPU rendering.
      // Restty embeds WASM (libghostty-vt) in its JS bundle — no separate .wasm fetch.
      //
      // Font loading: Nerd Fonts are embedded as base64 @font-face at Nix build time.
      // The restty fontSources use "local" type to match the embedded @font-face names.
      // =========================================================================

      import { Restty, getBuiltinTheme } from './restty/restty.js';

      // =========================================================================
      // THEME — use restty's shipped builtin (no hardcoded colors)
      // =========================================================================
      // restty bundles 300+ Ghostty themes parsed at runtime from the
      // assets/themes/ directory.  We select by name so upstream palette
      // updates flow through automatically.

      const THEME_NAME = 'Catppuccin Frappe';
      const theme = getBuiltinTheme(THEME_NAME);

      // Sync CSS custom properties from the loaded theme so the status bar
      // chrome matches the terminal without duplicating color constants.
      function syncCssVars(t) {
        if (!t?.colors) return;
        const c = t.colors;
        const root = document.documentElement.style;
        const hex = ({ r, g, b }) =>
          '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
        if (c.background) root.setProperty('--bg', hex(c.background));
        if (c.foreground) root.setProperty('--text', hex(c.foreground));
        // palette[2]=green, palette[3]=yellow, palette[1]=red from ANSI
        if (c.palette[2]) root.setProperty('--green', hex(c.palette[2]));
        if (c.palette[3]) root.setProperty('--yellow', hex(c.palette[3]));
        if (c.palette[1]) root.setProperty('--red', hex(c.palette[1]));
      }

      syncCssVars(theme);

      // =========================================================================
      // STATUS MANAGEMENT
      // =========================================================================

      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');

      function setStatus(state, text) {
        statusDot.className = 'status-dot ' + state;
        statusText.textContent = text;
      }

      // =========================================================================
      // TERMINAL INITIALIZATION
      // =========================================================================

      async function main() {
        setStatus('connecting', 'Loading fonts...');

        // Wait for embedded build-time fonts to be decoded
        try {
          await document.fonts.ready;
        } catch (err) {
          console.warn('Font loading check failed, continuing:', err);
        }

        setStatus('connecting', 'Loading terminal...');

        const container = document.getElementById('terminal');

        // Create restty instance with Catppuccin Frappe theme
        // Font: JetBrainsMono Nerd Font Mono embedded at build time (airgap-safe)
        const restty = new Restty({
          root: container,
          createInitialPane: true,
          appOptions: {
            renderer: 'auto',
            fontSize: 14,
            fontSizeMode: 'em',
            alphaBlending: 'native',
            fontPreset: 'none',
            autoResize: true,
          },
          fontSources: [
            {
              type: 'local',
              label: 'JetBrainsMono Nerd Font Mono',
              matchers: [
                'jetbrainsmono nerd font mono',
                'jetbrains mono nerd font mono',
                'jetbrains mono',
              ],
              required: true,
            },
          ],
        });

        // Apply builtin theme (restty ships the full Ghostty theme catalog)
        if (theme) {
          restty.applyTheme(theme, THEME_NAME);
        }

        // =====================================================================
        // WEBSOCKET CONNECTION
        // =====================================================================

        let reconnectAttempts = 0;
        const maxReconnectAttempts = 10;
        const reconnectDelay = 1000;

        function connect() {
          setStatus(
            'connecting',
            reconnectAttempts > 0 ? `Reconnecting (${reconnectAttempts})...` : 'Connecting...'
          );

          const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
          const ptyUrl = `${protocol}//${location.host}/pty`;

          // Use restty's built-in PTY connection
          restty.connectPty(ptyUrl);

          // Poll connection status via public API (ResttyActivePaneApi)
          const checkConnection = setInterval(() => {
            if (restty.isPtyConnected()) {
              setStatus('connected', 'Connected');
              reconnectAttempts = 0;
              clearInterval(checkConnection);
              restty.focus();
            }
          }, 100);

          // Timeout connection check
          setTimeout(() => {
            clearInterval(checkConnection);
            if (!restty.isPtyConnected()) {
              setStatus('disconnected', 'Connection failed');
              if (reconnectAttempts < maxReconnectAttempts) {
                reconnectAttempts++;
                setTimeout(connect, reconnectDelay * Math.min(reconnectAttempts, 5));
              }
            }
          }, 10000);
        }

        // Auto-resize on window resize via public API (ResttyActivePaneApi)
        window.addEventListener('resize', () => {
          restty.updateSize(true);
        });

        // Initial connection
        connect();

        // Focus terminal on click
        container.addEventListener('click', () => restty.focus());

        // Expose for debugging
        window.restty = restty;
      }

      main();
    </script>
  </body>
</html>
