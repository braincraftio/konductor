<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konductor Terminal</title>
  <!-- JetBrains Mono from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Nerd Font Symbols for TUI icons (tmux, neovim, lazygit, starship, etc.) */
    @font-face {
      font-family: 'Symbols Nerd Font Mono';
      src: url('https://cdn.jsdelivr.net/gh/ryanoasis/nerd-fonts@v3.3.0/patched-fonts/NerdFontsSymbolsOnly/SymbolsNerdFontMono-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  </style>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* =======================================================================
     * Catppuccin Frappé Theme
     * https://catppuccin.com/palette
     * Matches: tmux, neovim, opencode configs in this repo
     * ======================================================================= */
    :root {
      /* Base colors */
      --ctp-rosewater: #f2d5cf;
      --ctp-flamingo: #eebebe;
      --ctp-pink: #f4b8e4;
      --ctp-mauve: #ca9ee6;
      --ctp-red: #e78284;
      --ctp-maroon: #ea999c;
      --ctp-peach: #ef9f76;
      --ctp-yellow: #e5c890;
      --ctp-green: #a6d189;
      --ctp-teal: #81c8be;
      --ctp-sky: #99d1db;
      --ctp-sapphire: #85c1dc;
      --ctp-blue: #8caaee;
      --ctp-lavender: #babbf1;
      /* Surface colors */
      --ctp-text: #c6d0f5;
      --ctp-subtext1: #b5bfe2;
      --ctp-subtext0: #a5adce;
      --ctp-overlay2: #949cbb;
      --ctp-overlay1: #838ba7;
      --ctp-overlay0: #737994;
      --ctp-surface2: #626880;
      --ctp-surface1: #51576d;
      --ctp-surface0: #414559;
      --ctp-base: #303446;
      --ctp-mantle: #292c3c;
      --ctp-crust: #232634;
    }

    html, body {
      height: 100%;
      background: var(--ctp-base);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--ctp-mantle);
      border-bottom: 1px solid var(--ctp-surface0);
    }

    .title {
      color: var(--ctp-text);
      font-size: 14px;
      font-weight: 500;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ctp-subtext0);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ctp-overlay0);
    }

    .status-dot.connected {
      background: var(--ctp-green);
    }

    .status-dot.connecting {
      background: var(--ctp-yellow);
      animation: pulse 1s infinite;
    }

    .status-dot.disconnected {
      background: var(--ctp-red);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #terminal {
      flex: 1;
      padding: 8px;
    }

    #terminal canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Konductor Terminal</div>
      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
    <div id="terminal"></div>
  </div>

  <script type="module">
    import { init, Terminal, FitAddon } from './ghostty-web.js';

    // ==========================================================================
    // STATUS MANAGEMENT
    // ==========================================================================

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    function setStatus(state, text) {
      statusDot.className = 'status-dot ' + state;
      statusText.textContent = text;
    }

    // ==========================================================================
    // TERMINAL INITIALIZATION
    // ==========================================================================

    async function main() {
      setStatus('connecting', 'Loading fonts...');

      // CRITICAL: Wait for web fonts to load before measuring font metrics
      // Without this, terminal uses fallback font dimensions → blocky rendering
      // Note: Fonts are embedded at build time, but this ensures they're decoded
      try {
        await document.fonts.ready;
      } catch (err) {
        console.warn('Font loading check failed, continuing:', err);
      }

      setStatus('connecting', 'Loading terminal...');

      try {
        await init();
      } catch (err) {
        setStatus('disconnected', 'Failed to load terminal');
        console.error('Failed to initialize ghostty-web:', err);
        return;
      }

      // Catppuccin Frappé terminal theme
      // Matches tmux, neovim, opencode configs
      // Font: JetBrainsMono Nerd Font Mono embedded at build time (airgap-safe)
      const terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "'JetBrainsMono Nerd Font Mono', 'JetBrains Mono', 'Symbols Nerd Font Mono', monospace",
        scrollback: 10000,
        theme: {
          // Base colors
          background: '#303446',    // base
          foreground: '#c6d0f5',    // text
          cursor: '#f2d5cf',        // rosewater
          cursorAccent: '#303446',  // base
          selectionBackground: 'rgba(131, 139, 167, 0.3)',  // overlay1 @ 30%
          selectionForeground: '#c6d0f5',  // text
          // ANSI Normal
          black: '#51576d',         // surface1
          red: '#e78284',           // red
          green: '#a6d189',         // green
          yellow: '#e5c890',        // yellow
          blue: '#8caaee',          // blue
          magenta: '#ca9ee6',       // mauve
          cyan: '#81c8be',          // teal
          white: '#b5bfe2',         // subtext1
          // ANSI Bright
          brightBlack: '#626880',   // surface2
          brightRed: '#e78284',     // red
          brightGreen: '#a6d189',   // green
          brightYellow: '#e5c890',  // yellow
          brightBlue: '#8caaee',    // blue
          brightMagenta: '#f4b8e4', // pink
          brightCyan: '#99d1db',    // sky
          brightWhite: '#c6d0f5',   // text
        },
      });

      const fitAddon = new FitAddon();
      terminal.loadAddon(fitAddon);

      const container = document.getElementById('terminal');
      terminal.open(container);
      fitAddon.fit();

      // ==========================================================================
      // WEBSOCKET CONNECTION
      // ==========================================================================

      let ws = null;
      let reconnectAttempts = 0;
      const maxReconnectAttempts = 10;
      const reconnectDelay = 1000;

      function connect() {
        if (ws && ws.readyState === WebSocket.OPEN) return;

        setStatus('connecting', reconnectAttempts > 0 ? `Reconnecting (${reconnectAttempts})...` : 'Connecting...');

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const url = `${protocol}//${location.host}/ws?cols=${terminal.cols}&rows=${terminal.rows}`;

        ws = new WebSocket(url);

        ws.onopen = () => {
          setStatus('connected', 'Connected');
          reconnectAttempts = 0;
          terminal.focus();
        };

        ws.onmessage = (event) => {
          terminal.write(event.data);
        };

        ws.onclose = (event) => {
          setStatus('disconnected', event.reason || 'Disconnected');

          if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            setTimeout(connect, reconnectDelay * Math.min(reconnectAttempts, 5));
          } else {
            setStatus('disconnected', 'Connection failed');
          }
        };

        ws.onerror = () => {
          // Error will trigger close
        };
      }

      // Terminal -> WebSocket
      terminal.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(data);
        }
      });

      // Resize -> WebSocket
      terminal.onResize(({ cols, rows }) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols, rows }));
        }
      });

      // Auto-resize on window resize
      fitAddon.observeResize();

      // Initial connection
      connect();

      // Focus terminal on click
      container.addEventListener('click', () => terminal.focus());

      // Expose for debugging
      window.terminal = terminal;
      window.fitAddon = fitAddon;
    }

    main();
  </script>
</body>
</html>
