<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konductor Terminal</title>
  <!-- JetBrainsMono Nerd Font Mono, embedded at build time from
       src/lib/theme.nix-adjacent font config in default.nix.
       Airgap-safe: no CDN fetches; Nerd Font glyphs are in the
       patched Mono faces. -->
  @konductorEmbeddedFonts@
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* =======================================================================
     * Catppuccin Frappé Theme
     * Generated at build time from src/lib/theme.nix (SSOT) — the
     * placeholder below is replaced by default.nix installPhase.
     * Do not hand-write hex values here.
     * ======================================================================= */
    :root {
      @konductorThemeCssVars@
    }

    html, body {
      height: 100%;
      background: var(--ctp-base);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: var(--ctp-mantle);
      border-bottom: 1px solid var(--ctp-surface0);
    }

    .title {
      color: var(--ctp-text);
      font-size: 14px;
      font-weight: 500;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--ctp-subtext0);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ctp-overlay0);
    }

    .status-dot.connected {
      background: var(--ctp-green);
    }

    .status-dot.connecting {
      background: var(--ctp-yellow);
      animation: pulse 1s infinite;
    }

    .status-dot.disconnected {
      background: var(--ctp-red);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    #terminal {
      flex: 1;
      padding: 8px;
    }

    #terminal canvas {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="title">Konductor Terminal</div>
      <div class="status">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
    <div id="terminal"></div>
  </div>

  <script type="module">
    import { init, Terminal, FitAddon } from './ghostty-web.js';

    // ==========================================================================
    // STATUS MANAGEMENT
    // ==========================================================================

    const statusDot = document.getElementById('status-dot');
    const statusText = document.getElementById('status-text');

    function setStatus(state, text) {
      statusDot.className = 'status-dot ' + state;
      statusText.textContent = text;
    }

    // ==========================================================================
    // TERMINAL INITIALIZATION
    // ==========================================================================

    async function main() {
      setStatus('connecting', 'Loading fonts...');

      // CRITICAL: Wait for web fonts to load before measuring font metrics
      // Without this, terminal uses fallback font dimensions → blocky rendering
      // Note: Fonts are embedded at build time, but this ensures they're decoded
      try {
        await document.fonts.ready;
      } catch (err) {
        console.warn('Font loading check failed, continuing:', err);
      }

      setStatus('connecting', 'Loading terminal...');

      try {
        await init();
      } catch (err) {
        setStatus('disconnected', 'Failed to load terminal');
        console.error('Failed to initialize ghostty-web:', err);
        return;
      }

      // Terminal theme — injected at build time from src/lib/theme.nix (SSOT).
      // Font: JetBrainsMono Nerd Font Mono embedded at build time (airgap-safe).
      const terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: "'JetBrainsMono Nerd Font Mono', 'JetBrains Mono', monospace",
        scrollback: 10000,
        theme: @konductorTerminalThemeJson@,
      });

      const fitAddon = new FitAddon();
      terminal.loadAddon(fitAddon);

      const container = document.getElementById('terminal');
      terminal.open(container);
      fitAddon.fit();

      // ==========================================================================
      // WEBSOCKET CONNECTION
      // ==========================================================================

      let ws = null;
      let reconnectAttempts = 0;
      const maxReconnectAttempts = 10;
      const reconnectDelay = 1000;

      function connect() {
        if (ws && ws.readyState === WebSocket.OPEN) return;

        setStatus('connecting', reconnectAttempts > 0 ? `Reconnecting (${reconnectAttempts})...` : 'Connecting...');

        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const url = `${protocol}//${location.host}/ws?cols=${terminal.cols}&rows=${terminal.rows}`;

        ws = new WebSocket(url);

        ws.onopen = () => {
          setStatus('connected', 'Connected');
          reconnectAttempts = 0;
          terminal.focus();
        };

        ws.onmessage = (event) => {
          terminal.write(event.data);
        };

        ws.onclose = (event) => {
          setStatus('disconnected', event.reason || 'Disconnected');

          if (reconnectAttempts < maxReconnectAttempts) {
            reconnectAttempts++;
            setTimeout(connect, reconnectDelay * Math.min(reconnectAttempts, 5));
          } else {
            setStatus('disconnected', 'Connection failed');
          }
        };

        ws.onerror = () => {
          // Error will trigger close
        };
      }

      // Terminal -> WebSocket
      terminal.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(data);
        }
      });

      // Resize -> WebSocket
      terminal.onResize(({ cols, rows }) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols, rows }));
        }
      });

      // Auto-resize on window resize
      fitAddon.observeResize();

      // Initial connection
      connect();

      // Focus terminal on click
      container.addEventListener('click', () => terminal.focus());

      // Expose for debugging
      window.terminal = terminal;
      window.fitAddon = fitAddon;
    }

    main();
  </script>
</body>
</html>
