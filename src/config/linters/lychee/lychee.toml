# Lychee link checker configuration
# https://github.com/lycheeverse/lychee

# Display settings
no_progress = true  # Don't show progress bar (better for CI/CD and scripts)
format = "detailed" # Output format: compact, detailed, json, markdown, raw

# Maximum number of concurrent requests
max_concurrency = 10

# User agent string
user_agent = "Mozilla/5.0 (compatible; BrainCraft.io/1.0)"

# Request timeout in seconds
timeout = 20

# Maximum number of retries
max_retries = 2

# Accept these status codes
accept = [200, 201, 202, 203, 204, 206, 301, 302, 304, 401, 403]

# Exclude patterns
exclude = [
  # Localhost and local network
  "^https?://localhost",
  "^https?://127\\.0\\.0\\.1",
  "^https?://192\\.168\\.",
  "^https?://10\\.",

  # Common development URLs
  "^https?://example\\.com",
  "^https?://test\\.com",

  # GitHub edit/new links
  "^https://github\\.com/.*/edit/",
  "^https://github\\.com/.*/new/",

  # deepwiki.com serves a Vercel bot challenge (429, x-vercel-mitigated: challenge)
  # to every client without JavaScript, whatever the headers or request rate
  "^https://deepwiki\\.com/",

  # kustomize/go-getter remote refs (repo//subdir): resolved by kustomize, not HTTP
  "^https://github\\.com/[^/]+/[^/]+//",

  # Unexpanded ${...} templates in code blocks (Nix, shell)
  "\\$%7B",

  # Non-public names: .arpa (RFC 8375 home.arpa and similar internal zones)
  # and single-label hosts (placeholders such as https://ttyd-rw.<user>...)
  "^https?://[^/]+\\.arpa(/|:|$)",
  "^https?://[^./:]+(:[0-9]+)?(/|$)",

  # Anchors in markdown (handled separately)
  "^#",

  # NPM package internal file references (these don't exist in published packages)
  "^file://.*\\.npm-global/",
  "^file://.*node_modules/",

  # Common npm package documentation files that don't exist
  "CONTRIBUTING\\.md$",
  "CHANGELOG\\.md$",
  "MIGRATION\\.md$",
  "/docs/.*\\.md$",
  "/examples/.*\\.(js|ts|md)$",
  "/test/.*\\.(js|ts)$",
  "\\.verb\\.md$",
  "screenshot\\.(png|jpg|gif|svg)$",
  "logo\\.(png|jpg|gif|svg)$",
]

# Link checking behavior
include_verbatim = true    # Check links in verbatim sections (code blocks)
include_fragments = "full" # Check anchor (#section) and text (#:~:text=) fragments

# Network exclusions
exclude_link_local = true # Skip link-local addresses (169.254.x.x)
exclude_loopback = true   # Skip localhost and 127.0.0.1
exclude_private = true    # Exclude private IPs
# Mail addresses are not checked: lychee's include_mail defaults to false.

# Offline behavior
skip_missing = true # Skip missing files when offline

# Request cache on disk (.lycheecache in the working directory); CI restores it
# between runs. Entries older than max_cache_age are discarded.
cache = true
max_cache_age = "1d"
# Rate limits and server errors are transient; caching them would replay one
# failure into every run until the entry expires.
cache_exclude_status = "429, 500.."

# Exclude paths (regular expressions matched against the input path).
# Each entry matches the directory as a whole path component.
exclude_path = [
  # Dependencies and build artifacts
  "(^|/)\\.npm-global(/|$)",
  "(^|/)node_modules(/|$)",
  "(^|/)\\.git(/|$)",
  "(^|/)\\.mise(/|$)",
  "(^|/)\\.cargo(/|$)",
  "(^|/)\\.cache(/|$)",
  "(^|/)target(/|$)",
  "(^|/)dist(/|$)",
  "(^|/)build(/|$)",
  "(^|/)tmp(/|$)",
  "(^|/)\\.reports(/|$)",
  "(^|/)_sources(/|$)",
]

# Per-host request limits (tables last: keys after a table header belong to
# it). github.com answers bursts of concurrent page requests with 503.
[hosts."github.com"]
concurrency = 2
request_interval = "250ms"
