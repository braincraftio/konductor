[package]
name = "konductor-tree"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "Repository tree with tree-compatible options, ripgrep ignore rules, line counts, Git status, and omission provenance."
license = "MIT"
publish = false

[[bin]]
name = "tree"
path = "src/main.rs"

[dependencies]
anyhow = "1"
globset = "0.4"
ignore = "0.4"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# preserve_order: path sections apply in file order (later sections win).
toml = { version = "1", features = ["preserve_order"] }

# Everything below this line is the [lints] table of templates/rust-application
# (BeautifulRust lints/lints.toml minus the [lib] keys), kept identical so this
# crate follows the same policy as every Konductor application.

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
