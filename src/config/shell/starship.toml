# Konductor Starship Prompt - V2 Optimized
#
# Design Philosophy: Actionable Information Only
#   - Show what requires attention or action
#   - Hide slow-churn data (versions, static context)
#   - Anomaly-driven: silent when normal, visible when not
#
# Target Aesthetic: macOS Tahoe / PopOS Cosmic / Windows 11
#   - Clean, minimal, information-dense
#   - Catppuccin Frappe palette (matches tmux)
#
# Performance: Optimized for containers, VMs, 9p/NFS mounts
#   - Increased timeouts for network filesystems
#   - Minimal subprocess spawning

"$schema" = "https://raw.githubusercontent.com/starship/starship/master/.github/config-schema.json"

# Performance tuning for slow filesystems (9p, NFS, SSHFS)
scan_timeout = 500
command_timeout = 1000
add_newline = true

# Single-line prompt: directory + git + anomalies only
# Two-line for input character (visual separation)
format = """
$username$hostname$container$kubernetes\
$directory$git_branch$git_status$git_state\
$cmd_duration$fill$jobs
$character"""

# Catppuccin Frappe palette (SSOT with tmux theme)
palette = "frappe"

[palettes.frappe]
rosewater = "#f2d5cf"
flamingo = "#eebebe"
pink = "#f4b8e4"
mauve = "#ca9ee6"
red = "#e78284"
maroon = "#ea999c"
peach = "#ef9f76"
yellow = "#e5c890"
green = "#a6d189"
teal = "#81c8be"
sky = "#99d1db"
sapphire = "#85c1dc"
blue = "#8caaee"
lavender = "#babbf1"
text = "#c6d0f5"
subtext1 = "#b5bfe2"
subtext0 = "#a5adce"
overlay2 = "#949cbb"
overlay1 = "#838ba7"
overlay0 = "#737994"
surface2 = "#626880"
surface1 = "#51576d"
surface0 = "#414559"
base = "#303446"
mantle = "#292c3c"
crust = "#232634"

# ===========================================================================
# ALWAYS SHOW - Core Navigation
# ===========================================================================

[character]
# Clean prompt character - green success, red error
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
# Tight truncation - repo-relative paths
truncation_length = 2
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold mauve"
read_only = " "
read_only_style = "red"
home_symbol = "~"

[fill]
symbol = " "

# ===========================================================================
# SHOW WHEN ANOMALOUS - Git State
# ===========================================================================

[git_branch]
# Branch name only - no decoration
format = "[$branch(:$remote_branch)]($style) "
style = "green"
truncation_length = 24
truncation_symbol = "…"
# No symbol - branch name is self-explanatory

[git_status]
# ONLY blocking states: conflicts, diverged, unpushed
# Hide noise: untracked, modified, staged (normal workflow states)
format = "([$conflicted$diverged$ahead$behind]($style))"
style = "bold yellow"
conflicted = "[conflict](bold red) "
diverged = "[diverged](bold red) "
ahead = "[↑$count](green) "
behind = "[↓$count](yellow) "
# Explicitly empty - hide these workflow states
untracked = ""
stashed = ""
modified = ""
staged = ""
renamed = ""
deleted = ""
up_to_date = ""
ignore_submodules = true

[git_state]
# Rebase/merge/cherry-pick in progress - always show (blocking)
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bold peach"

# ===========================================================================
# CONTEXTUAL - Show Only When Relevant
# ===========================================================================

[username]
# Only show for SSH or root (security awareness)
style_user = "teal"
style_root = "bold red"
format = "[$user]($style)"
show_always = false

[hostname]
# SSH indicator - critical for nested sessions
ssh_only = true
format = "[@$hostname]($style) "
style = "teal"

[container]
# Container indicator - OCI/Docker environment awareness
format = "[⬢]($style) "
style = "blue"

[kubernetes]
# Only show when KUBECONFIG is set AND k8s files present
# Prevents showing in every directory with a charts/ folder
disabled = false
format = "[☸ $context(:$namespace)]($style) "
style = "blue"
detect_env_vars = ["KUBECONFIG"]
detect_files = []
detect_folders = []
detect_extensions = []

[cmd_duration]
# Long-running command indicator (>3 seconds)
min_time = 3000
format = "[$duration]($style) "
style = "overlay1"
show_milliseconds = false

[jobs]
# Background jobs - actionable (jobs command)
format = "[$symbol$number]($style)"
symbol = " "
style = "bold yellow"
number_threshold = 1

# ===========================================================================
# DISABLED - Slow-Churn Noise (not actionable)
# ===========================================================================
# Language versions: py3.13, go1.24, node22 rarely change
# Showing them constantly provides no decision-making value

[python]
disabled = true

[golang]
disabled = true

[nodejs]
disabled = true

[rust]
disabled = true

[nix_shell]
# Always in nix shell = constant indicator = zero signal
disabled = true

[pulumi]
# Stack name is noise unless actively deploying
disabled = true

[docker_context]
# Context rarely changes within session
disabled = true

# Cloud providers - use CLI directly when needed
[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true

# Package version - not actionable from prompt
[package]
disabled = true

# Git commit hash - rarely needed in prompt
[git_commit]
disabled = true

# Git metrics (insertions/deletions) - noise
[git_metrics]
disabled = true

# Memory/battery - OS provides this better
[memory_usage]
disabled = true

[battery]
disabled = true

# Time - OS menubar/taskbar shows this
[time]
disabled = true
