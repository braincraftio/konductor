# lint.toml - Linting tasks for Konductor
#
# Every task delegates to the runme task of the same name in
# docs/developer_guide/LINT.md. The runme tasks call the konductor-wrapped,
# store-pinned tools that lefthook and `nix flake check` use, over git-tracked
# files. Linting is implemented once; mise only provides aliases.
#
# Task naming convention: lint:domain

# Note: The top-level [tasks.lint] is defined in main.toml

["lint:nix"]
description = "❄️ Lint Nix files (statix, deadnix) • ln"
alias = ["ln"]
run = "runme run lint:nix"

["lint:nix:flake"]
description = "🔎 Check flake with nix flake check • lnf"
alias = ["lnf"]
dir = "{{ config_root }}"
run = "nix flake check --all-systems"

["lint:python"]
description = "🐍 Lint Python (ruff, mypy, bandit) • lp"
alias = ["lp"]
run = "runme run lint:python"

["lint:js"]
description = "📦 Lint JS/TS/JSON (biome) • lj"
alias = ["lj"]
run = "runme run lint:js"

["lint:bash"]
description = "🐚 Lint shell scripts (shellcheck) • lb"
alias = ["lb", "lint:sh", "lint:shell"]
run = "runme run lint:bash"

["lint:yaml"]
description = "📄 Lint YAML (yamllint) • ly"
alias = ["ly"]
run = "runme run lint:yaml"

["lint:toml"]
description = "📜 Lint TOML (taplo) • lt"
alias = ["lt"]
run = "runme run lint:toml"

["lint:actions"]
description = "🎬 Lint GitHub Actions workflows (actionlint) • la"
alias = ["la", "lint:gha"]
run = "runme run lint:actions"

["lint:docker"]
description = "🐳 Lint Dockerfiles (hadolint) • ld"
alias = ["ld", "lint:dockerfile"]
run = "runme run lint:docker"

["lint:markdown"]
description = "📝 Lint Markdown and check links offline (markdownlint, lychee) • lm"
alias = ["lm", "lint:md", "lint:docs", "lint:links", "ll"]
run = "runme run lint:docs"

["lint:spell"]
description = "🔤 Spell check (cspell) • lsp"
alias = ["lsp"]
run = "runme run lint:spell"

["lint:secrets"]
description = "🔐 Scan for secrets against .secrets.baseline • lsec"
alias = ["lsec"]
run = "runme run lint:secrets"
