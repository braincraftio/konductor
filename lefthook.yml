---
# lefthook.yml - Konductor git hooks
#
# lefthook owns .git/hooks in this repository (pre-commit and prek ship in the
# devshell for consuming projects and are never installed here).
#
# Every job calls the konductor-wrapped, store-pinned tool that runme tasks and
# `nix flake check` use. Formatting has one owner: treefmt (nix fmt). Lint jobs
# never rewrite files; the fmt job fails when treefmt changes a staged file.
#
#   lefthook install                               install hooks
#   lefthook check-install                         verify hooks are installed
#   lefthook validate                              validate this file
#   lefthook run pre-commit --no-auto-install --tag nix
#   LEFTHOOK=0 git commit ...                      bypass hooks for one commit
min_version: 1.12.0
assert_lefthook_installed: true
colors: true
no_tty: false

output:
  - execution_info
  - success
  - failure
  - summary

pre-commit:
  parallel: true
  jobs:
    # ------------------------------------------------------------------------
    # Formatting (single owner: treefmt, same config as nix fmt / checks.treefmt)
    # ------------------------------------------------------------------------
    - name: fmt
      run: treefmt --fail-on-change --no-cache {staged_files}
      tags: [format]
      fail_text: |
        treefmt reformatted staged files. Review and stage the result.
        How to fix: nix fmt

    # ------------------------------------------------------------------------
    # Nix
    # ------------------------------------------------------------------------
    - name: nix-lint
      glob: "*.nix"
      # statix check takes a single target; it walks the tree honouring
      # .gitignore and the wrapped statix.toml ignore list.
      run: statix check
      tags: [nix, lint]

    - name: nix-deadcode
      glob: "*.nix"
      run: deadnix --fail -- {staged_files}
      tags: [nix, lint]

    # ------------------------------------------------------------------------
    # Python
    # ------------------------------------------------------------------------
    - name: python-lint
      glob: "*.py"
      run: ruff check {staged_files}
      tags: [python, lint]

    - name: python-types
      glob: "*.py"
      run: mypy {staged_files}
      tags: [python, types]

    - name: python-security
      glob: "*.py"
      run: bandit {staged_files}
      tags: [python, security]

    # ------------------------------------------------------------------------
    # JavaScript / TypeScript / JSON (single owner: biome)
    # ------------------------------------------------------------------------
    - name: js-lint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc}"
      run: biome lint --no-errors-on-unmatched {staged_files}
      tags: [javascript, lint]

    # ------------------------------------------------------------------------
    # Shell
    # ------------------------------------------------------------------------
    - name: shell-lint
      glob: "*.{sh,bash}"
      run: shellcheck {staged_files}
      tags: [shell, lint]

    # ------------------------------------------------------------------------
    # Config files
    # ------------------------------------------------------------------------
    - name: yaml-lint
      glob: "*.{yml,yaml}"
      run: yamllint {staged_files}
      tags: [config, lint]

    - name: toml-lint
      glob: "*.toml"
      run: taplo lint {staged_files}
      tags: [config, lint]

    - name: actions-lint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
      tags: [ci, lint]

    - name: docker-lint
      glob: "**/Dockerfile*"
      run: hadolint {staged_files}
      tags: [docker, lint]

    # ------------------------------------------------------------------------
    # Go / Web
    # ------------------------------------------------------------------------
    - name: go-lint
      glob: "*.go"
      run: golangci-lint run
      tags: [go, lint]

    - name: html-lint
      glob: "*.html"
      run: htmlhint {staged_files}
      tags: [web, lint]

    - name: css-lint
      glob: "*.{css,scss,sass}"
      run: stylelint {staged_files}
      tags: [web, lint]

    # ------------------------------------------------------------------------
    # Documentation
    # ------------------------------------------------------------------------
    - name: markdown-lint
      glob: "*.{md,markdown}"
      run: markdownlint-cli2 {staged_files}
      tags: [docs, lint]

    - name: spell-check
      glob: "*.{md,markdown,txt,js,jsx,ts,tsx,py,go,rs,nix}"
      run: cspell lint --no-progress --no-must-find-files {staged_files}
      tags: [docs, spelling]

    - name: markdown-links
      glob: "*.{md,markdown}"
      run: lychee --offline --no-progress {staged_files}
      tags: [docs, links]
      skip:
        - merge
        - rebase

    # ------------------------------------------------------------------------
    # Secrets (gate: detect-secrets-hook; baseline maintenance: runme)
    # --no-verify keeps detection and disables only vendor liveness checks.
    # With verification on, a finding the vendor reports invalid (revoked key)
    # is filtered out and never fails the gate; every candidate is sent to that
    # vendor's API (aws, stripe, slack, mailchimp, telegram, ibm, cloudant,
    # softlayer); and a network error changes the result. --no-verify reports
    # every candidate, offline and deterministic. Same mode as runme
    # lint:secrets and secrets:baseline:update, so the baseline filter set
    # never churns between them.
    # ------------------------------------------------------------------------
    - name: secrets
      exclude:
        - ".secrets.baseline"
      run: detect-secrets-hook --no-verify --baseline .secrets.baseline {staged_files}
      tags: [security]
      fail_text: |
        Potential secret in staged files.
        Real secret: remove it. False positive: runme run secrets:baseline:update, then audit.

commit-msg:
  jobs:
    - name: conventional-commits
      run: commitlint --edit {1}
      tags: [commits]
