# =============================================================================
# Konductor Instance: k901
# =============================================================================
# Dev workstation instance for canary deployments.
#
# Deploy:
#   ./deploy.sh
#   kubectl apply -k .
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: k901

resources:
  - ../../advanced
  - usrbinkat-home-pvc.yaml

namespace: konductor

patches:
  # VM: Strategic merge patch for instance-specific values
  - path: vm-patch.yaml

  # VM: Rename to k901
  - target:
      kind: VirtualMachine
      name: konductor
    patch: |-
      - op: replace
        path: /metadata/name
        value: k901

  # Secrets: Rename via JSON patch
  - target:
      kind: Secret
      name: konductor-userdata
    patch: |-
      - op: replace
        path: /metadata/name
        value: k901-userdata

  - target:
      kind: Secret
      name: konductor-networkdata
    patch: |-
      - op: replace
        path: /metadata/name
        value: k901-networkdata

  # PVCs: workspace SHARED with konductor, home is k901-specific
  # k901 uses konductor-workspace (shared) and k901-usrbinkat-home (standalone)
  # Home PVC separate due to QEMU disk locking on disk images

  # Job: Rename
  - target:
      kind: Job
      name: konductor-kubeconfig-generator
    patch: |-
      - op: replace
        path: /metadata/name
        value: k901-kubeconfig-generator

labels:
  - pairs:
      app.kubernetes.io/instance: k901
    includeSelectors: false
