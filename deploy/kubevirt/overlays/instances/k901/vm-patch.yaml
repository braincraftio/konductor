# =============================================================================
# VM Strategic Merge Patch for k901 Instance
# =============================================================================
# Disk optimization for Rook Ceph NVMe block over RDMA:
#   - cache: none (bypass host cache, direct to Ceph)
#   - io: native (use native AIO for block devices)
#   - volumeMode: Block for optimal performance
# =============================================================================
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: konductor
  labels:
    app: k901
spec:
  dataVolumeTemplates:
    - metadata:
        name: k901-root
        labels:
          app: k901
      spec:
        pvc:
          volumeMode: Block
          resources:
            requests:
              storage: 500Gi
        source:
          registry:
            url: docker://registry.c0a801c5.sslip.io/containercraft/konductor@sha256:821d041c5f757415993f5ea41cd75835e740976792aaee2896e00fe459d9bb50
            secretRef: zot-registry-credentials
  template:
    metadata:
      labels:
        app: k901
        kubevirt.io/domain: k901
    spec:
      hostname: k901
      nodeSelector:
        kubernetes.io/hostname: t640
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: k901-ssh-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - usrbinkat
                  - kc2
                  - kc2admin
                  - runner
      domain:
        cpu:
          cores: 8
          sockets: 1
          threads: 2
          maxSockets: 4
          model: host-passthrough
        memory:
          guest: 32Gi
          maxGuest: 128Gi
        resources:
          requests:
            memory: 32Gi
        devices:
          # Disks optimized for Rook Ceph NVMe block over RDMA
          disks:
            - name: root-disk
              bootOrder: 1
              cache: none
              io: native
              disk:
                bus: virtio
            - name: cloudinitdisk
              bootOrder: 2
              disk:
                bus: virtio
            - name: kubeconfig
              serial: iso-root-755-m.kube
              disk:
                bus: virtio
            - name: git-disk
              serial: e4-root-775-h.Git
              cache: none
              io: native
              disk:
                bus: virtio
            - name: home-disk-usrbinkat
              serial: e4-usrbinkat-700-h.u
              cache: none
              io: native
              disk:
                bus: virtio
          interfaces:
            - name: pod
              model: virtio
              masquerade: {}
            - name: macvtap
              model: virtio
              macAddress: "52:54:00:c0:9d:01"
              binding:
                name: macvtap
            - name: br0
              model: virtio
              bridge: {}
      networks:
        - name: pod
          pod: {}
        - name: macvtap
          multus:
            networkName: macvtap
        - name: br0
          multus:
            networkName: br0
      volumes:
        - name: root-disk
          dataVolume:
            name: k901-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: k901-userdata
            networkDataSecretRef:
              name: k901-networkdata
        - name: kubeconfig
          secret:
            secretName: k901-kubeconfig
            optional: true
        # Shared PVCs with konductor - persistent user data across instances
        - name: git-disk
          persistentVolumeClaim:
            claimName: konductor-git
        - name: home-disk-usrbinkat
          persistentVolumeClaim:
            claimName: konductor-usrbinkat-home
