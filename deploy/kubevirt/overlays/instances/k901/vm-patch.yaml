# =============================================================================
# VM Strategic Merge Patch for k901 Instance
# =============================================================================
# Clones root disk from golden image snapshot for instant provisioning.
# Golden image: kubevirt/konductor-golden-snapshot
# =============================================================================
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: konductor
  labels:
    app: k901
spec:
  dataVolumeTemplates:
    - metadata:
        name: k901-root
        labels:
          app: k901
      spec:
        # Use spec.storage for CDI auto-inference from StorageProfile
        storage:
          accessModes:
            - ReadWriteOnce
          volumeMode: Block
          storageClassName: ceph-nvme-vm-block
          resources:
            requests:
              # Expand from golden image base size (64Gi) to full VM disk
              storage: 500Gi
        source:
          # Clone from golden image snapshot (instant, no registry import)
          snapshot:
            name: konductor-golden-snapshot
            namespace: konductor
  template:
    metadata:
      labels:
        app: k901
        kubevirt.io/domain: k901
    spec:
      hostname: k901
      nodeSelector:
        kubernetes.io/hostname: t640
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: k901-ssh-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - usrbinkat
                  - kc2
                  - kc2admin
                  - runner
      domain:
        cpu:
          cores: 8
          sockets: 1
          threads: 2
          maxSockets: 4
          model: host-passthrough
        memory:
          hugepages:
            pageSize: "1Gi"
          guest: 32Gi
          maxGuest: 128Gi
        resources:
          requests:
            memory: 32Gi
        devices:
          # Disks optimized for Rook Ceph NVMe block over RDMA
          disks:
            - name: root-disk
              bootOrder: 1
              cache: none
              io: native
              disk:
                bus: virtio
            - name: cloudinitdisk
              bootOrder: 2
              disk:
                bus: virtio
            - name: kubeconfig
              serial: iso-root-755-m.kube
              disk:
                bus: virtio
            - name: workspace-disk
              serial: e4-usrbinkat-775-w
              cache: none
              io: native
              disk:
                bus: virtio
            - name: home-disk-usrbinkat
              serial: e4-usrbinkat-700-h.u
              cache: none
              io: native
              disk:
                bus: virtio
          interfaces:
            - name: pod
              model: virtio
              masquerade: {}
            - name: macvtap
              model: virtio
              macAddress: "52:54:00:c0:9d:02"
              binding:
                name: macvtap
            - name: br0
              model: virtio
              bridge: {}
      networks:
        - name: pod
          pod: {}
        - name: macvtap
          multus:
            networkName: macvtap
        - name: br0
          multus:
            networkName: br0
      volumes:
        - name: root-disk
          dataVolume:
            name: k901-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: k901-userdata
            networkDataSecretRef:
              name: k901-networkdata
        - name: kubeconfig
          secret:
            secretName: k901-kubeconfig
            optional: true
        # Workspace: shared with konductor for collaborative git repos
        - name: workspace-disk
          persistentVolumeClaim:
            claimName: konductor-workspace
        # Home: k901-specific (QEMU disk locking prevents shared disk images)
        - name: home-disk-usrbinkat
          persistentVolumeClaim:
            claimName: k901-usrbinkat-home
