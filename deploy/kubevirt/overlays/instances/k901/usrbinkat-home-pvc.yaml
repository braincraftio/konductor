# =============================================================================
# Persistent Volume Claim for k901 User Home Directory
# =============================================================================
# Separate home PVC for k901 instance (not shared with konductor)
# QEMU disk locking prevents sharing disk images between running VMs
# ReadWriteMany for future live migration support
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: k901-usrbinkat-home
  labels:
    app: k901
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: cephfs-nvme-vm
  resources:
    requests:
      storage: 100Gi
