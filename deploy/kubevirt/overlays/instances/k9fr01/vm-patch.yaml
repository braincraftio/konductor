# =============================================================================
# VM Strategic Merge Patch for k9fr01 Instance
# =============================================================================
# Complete VM spec for Forgejo runner instance k9fr01.
#
# IMPORTANT: Kustomize replaces arrays, it does not merge them.
# This patch must include ALL disks, interfaces, volumes, and networks
# to produce a complete VM spec.
#
# Disk optimization for Rook Ceph NVMe block over RDMA:
#   - cache: none (bypass host cache, direct to Ceph)
#   - io: native (use native AIO for block devices)
#   - volumeMode: Block for optimal performance
# =============================================================================
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: forgejo-konductor
  labels:
    app: k9fr01
spec:
  dataVolumeTemplates:
    - metadata:
        name: k9fr01-root
        labels:
          app: k9fr01
      spec:
        pvc:
          accessModes:
            - ReadWriteOnce
          volumeMode: Block
          resources:
            requests:
              storage: 120Gi
          storageClassName: ceph-nvme-vm-block
        source:
          snapshot:
            name: konductor-local-snapshot
            namespace: kubevirt
  template:
    metadata:
      labels:
        app: k9fr01
        kubevirt.io/domain: k9fr01
    spec:
      hostname: k9fr01
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: k9fr01-ssh-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - runner
                  - kc2admin
      domain:
        cpu:
          cores: 8
          sockets: 1
          threads: 2
          maxSockets: 4
          model: host-passthrough
        memory:
          hugepages:
            pageSize: "1Gi"
          guest: 32Gi
          maxGuest: 128Gi
        resources:
          requests:
            memory: 32Gi
        devices:
          # =================================================================
          # Disks - ALL disks (optimized for Rook Ceph NVMe block)
          # =================================================================
          disks:
            - name: root-disk
              bootOrder: 1
              cache: none
              io: native
              disk:
                bus: virtio
            - name: cloudinitdisk
              bootOrder: 2
              disk:
                bus: virtio
            - name: kubeconfig
              serial: iso-root-755-m.kube
              disk:
                bus: virtio
            - name: workspace-disk
              serial: e4-runner-775-w
              cache: none
              io: native
              disk:
                bus: virtio
          # =================================================================
          # Interfaces - ALL interfaces
          # =================================================================
          interfaces:
            - name: pod
              model: virtio
              masquerade: {}
            - name: macvtap
              model: virtio
              macAddress: "02:00:00:f0:9e:01"
              binding:
                name: macvtap
            - name: br0
              model: virtio
              bridge: {}
      # =====================================================================
      # Networks - reference NADs with forgejo- prefix
      # =====================================================================
      networks:
        - name: pod
          pod: {}
        - name: macvtap
          multus:
            networkName: forgejo-macvtap
        - name: br0
          multus:
            networkName: forgejo-br0
      # =====================================================================
      # Volumes - ALL volumes with k9fr01-specific references
      # =====================================================================
      volumes:
        - name: root-disk
          dataVolume:
            name: k9fr01-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: k9fr01-userdata
            networkDataSecretRef:
              name: k9fr01-networkdata
        - name: kubeconfig
          secret:
            secretName: k9fr01-kubeconfig
            optional: true
        - name: workspace-disk
          persistentVolumeClaim:
            claimName: k9fr01-workspace
