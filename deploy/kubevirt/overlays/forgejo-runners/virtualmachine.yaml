# =============================================================================
# Forgejo Runner VirtualMachine Patch
# =============================================================================
# Strategic merge patch that modifies base VM for CI/CD workloads.
#
# IMPORTANT: Kustomize replaces arrays, it does not merge them.
# This patch must include ALL disks, interfaces, and volumes - both base
# elements AND additions - to produce a complete VM spec.
#
# Changes from base:
#   - Rename VM to forgejo-konductor (via namePrefix)
#   - Keep default storage (120Gi - sufficient for CI workloads)
#   - Add workspace PVC disk for runner workspace
#   - Limit SSH users to runner and kc2admin
#   - Set unique MAC address for macvtap interface
#   - Use registry source with immutable digest (not tag)
#
# Disk optimization for Rook Ceph NVMe block over RDMA:
#   - cache: none (bypass host cache, direct to Ceph)
#   - io: native (use native AIO for block devices)
#   - Block mode PVC for optimal performance
# =============================================================================
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: konductor
  labels:
    app: forgejo-runner
spec:
  dataVolumeTemplates:
    - metadata:
        name: forgejo-konductor-root
      spec:
        # Use spec.storage for CDI auto-inference from StorageProfile
        storage:
          accessModes:
            - ReadWriteOnce
          volumeMode: Block
          storageClassName: ceph-nvme-vm-block
          resources:
            requests:
              storage: 500Gi
        source:
          # Clone from golden image snapshot (cross-namespace from konductor)
          snapshot:
            name: konductor-golden-snapshot
            namespace: konductor
  template:
    metadata:
      labels:
        app: forgejo-runner
        kubevirt.io/domain: forgejo-runner
    spec:
      hostname: forgejo-runner
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: forgejo-runner-ssh-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - runner
                  - kc2admin
      domain:
        devices:
          # ===================================================================
          # Disks - ALL disks (base + additions)
          # ===================================================================
          disks:
            # Base disks - optimized for Rook Ceph NVMe block over RDMA
            - name: root-disk
              bootOrder: 1
              cache: none
              io: native
              disk:
                bus: virtio
            - name: cloudinitdisk
              bootOrder: 2
              disk:
                bus: virtio
            - name: kubeconfig
              serial: iso-root-755-m.kube
              disk:
                bus: virtio
            # Additional disk for forgejo runner
            - name: workspace-disk
              serial: e4-runner-775-w
              cache: none
              io: native
              disk:
                bus: virtio
          # ===================================================================
          # Interfaces - ALL interfaces (base + modifications)
          # ===================================================================
          interfaces:
            - name: pod
              model: virtio
              masquerade: {}
            - name: macvtap
              model: virtio
              macAddress: "02:00:00:f0:9e:01"  # Unique MAC for runner
              binding:
                name: macvtap
            - name: br0
              model: virtio
              bridge: {}
      # =======================================================================
      # Networks - must reference NAD names as they appear AFTER namePrefix
      # =======================================================================
      networks:
        - name: pod
          pod: {}
        - name: macvtap
          multus:
            networkName: forgejo-macvtap
        - name: br0
          multus:
            networkName: forgejo-br0
      # =======================================================================
      # Volumes - ALL volumes (base + additions)
      # =======================================================================
      volumes:
        # Base volumes
        - name: root-disk
          dataVolume:
            name: forgejo-konductor-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: forgejo-konductor-userdata
            networkDataSecretRef:
              name: forgejo-konductor-networkdata
        - name: kubeconfig
          secret:
            secretName: forgejo-konductor-kubeconfig
            optional: true
        # Additional volume for forgejo runner
        - name: workspace-disk
          persistentVolumeClaim:
            claimName: forgejo-runner-workspace
