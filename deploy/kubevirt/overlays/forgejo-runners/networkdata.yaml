# =============================================================================
# Network Data Secret - Forgejo Runners Configuration
# =============================================================================
# Cloud-init v2 network configuration for triple-NIC setup:
#   - enp1s0: Pod network interface (for Kubernetes API access)
#   - enp3s0: macvtap interface (physical network with DHCP)
#   - enp2s0: OVS bridge slave (for nested virt, no IP)
#   - br0: Bridge device with no IP (used by nested VMs)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-networkdata
  labels:
    app: forgejo-runner
type: Opaque
stringData:
  networkdata: |
    version: 2
    renderer: networkd
    ethernets:
      enp1s0:
        # Pod network interface - for Kubernetes API access
        dhcp4: true
        dhcp6: false
        routes:
          # Route Kubernetes service CIDR through pod network
          - to: 10.96.0.0/12
            via: 0.0.0.0
            metric: 100
          # Route pod CIDR through pod network
          - to: 10.244.0.0/16
            via: 0.0.0.0
            metric: 100
        dhcp4-overrides:
          route-metric: 200
      enp2s0:
        # macvtap - physical network (default route)
        dhcp4: true
        dhcp6: false
        dhcp-identifier: mac
        dhcp4-overrides:
          route-metric: 300
      enp3s0:
        # OVS bridge slave - no IP
        dhcp4: false
        dhcp6: false
        link-local: []
        optional: true
    bridges:
      br0:
        interfaces:
          - enp3s0
        dhcp4: false
        dhcp6: false
        link-local: []
        parameters:
          stp: false
          forward-delay: 0
