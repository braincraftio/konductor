# =============================================================================
# ServiceAccount for Forgejo Runner kubectl access
# =============================================================================
# Minimal permissions for CI/CD workloads:
#   - Read-only access to most resources (for testing/validation)
#   - Create/update/delete for pods, jobs, deployments (for running CI jobs)
#   - NO secrets write access (read-only for testing)
#   - NO RBAC modification (cannot escalate privileges)
#   - NO serviceaccount impersonation (cannot assume other identities)
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner-vm
  labels:
    app: forgejo-runner
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-runner-vm-token
  labels:
    app: forgejo-runner
  annotations:
    kubernetes.io/service-account.name: forgejo-runner-vm
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-ci
  labels:
    app: forgejo-runner
rules:
  # -------------------------------------------------------------------------
  # Read-only: Most resources for testing/validation
  # -------------------------------------------------------------------------
  - apiGroups: [""]
    resources:
      - configmaps
      - endpoints
      - events
      - persistentvolumeclaims
      - pods
      - pods/log
      - pods/status
      - services
      - serviceaccounts
      - secrets  # Read-only for testing secret existence/structure
    verbs: [get, list, watch]

  - apiGroups: [apps]
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs: [get, list, watch]

  - apiGroups: [batch]
    resources:
      - cronjobs
      - jobs
    verbs: [get, list, watch]

  - apiGroups: [networking.k8s.io]
    resources:
      - ingresses
      - networkpolicies
    verbs: [get, list, watch]

  - apiGroups: [rbac.authorization.k8s.io]
    resources:
      - roles
      - rolebindings
    verbs: [get, list, watch]

  # -------------------------------------------------------------------------
  # Write: Core CI workload resources
  # -------------------------------------------------------------------------
  - apiGroups: [""]
    resources:
      - pods
      - pods/attach
      - pods/exec
      - pods/portforward
    verbs: [create, delete, deletecollection, patch, update]

  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs: [create]

  - apiGroups: [batch]
    resources:
      - jobs
    verbs: [create, delete, deletecollection, patch, update]

  - apiGroups: [apps]
    resources:
      - deployments
      - replicasets
    verbs: [create, delete, deletecollection, patch, update]

  # -------------------------------------------------------------------------
  # Write: ConfigMaps (for job artifacts, test data)
  # -------------------------------------------------------------------------
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: [create, delete, deletecollection, patch, update]

  # -------------------------------------------------------------------------
  # KubeVirt: Read-only VM resources for testing
  # -------------------------------------------------------------------------
  - apiGroups: [kubevirt.io]
    resources:
      - virtualmachines
      - virtualmachineinstances
    verbs: [get, list, watch]

  - apiGroups: [cdi.kubevirt.io]
    resources:
      - datavolumes
    verbs: [get, list, watch]

  # -------------------------------------------------------------------------
  # Explicitly DENY by omission:
  #   - secrets (write) - can read but not create/modify
  #   - serviceaccounts (all) - cannot create/impersonate
  #   - rbac.authorization.k8s.io (all) - cannot modify RBAC
  #   - persistentvolumeclaims (write) - cannot create storage
  #   - namespace resources - cannot modify namespace
  # -------------------------------------------------------------------------
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-vm-ci
  labels:
    app: forgejo-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-runner-ci
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-vm
    namespace: forgejo-runners
