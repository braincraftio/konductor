# =============================================================================
# ServiceAccount for kubeconfig-generator Job
# =============================================================================
# Separate from forgejo-runner-vm - needs permissions to create secrets.
# The generated kubeconfig uses forgejo-runner-vm which has minimal CI perms.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeconfig-generator
  labels:
    app: forgejo-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeconfig-generator
  labels:
    app: forgejo-runner
rules:
  # Read RBAC to validate configuration
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list]
  # Read ServiceAccount token secret
  - apiGroups: [""]
    resources: [secrets, serviceaccounts]
    verbs: [get, list]
  # Create/update kubeconfig secret
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, patch, update]
  # List pods for testing
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeconfig-generator
  labels:
    app: forgejo-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeconfig-generator
subjects:
  - kind: ServiceAccount
    name: kubeconfig-generator
    namespace: forgejo-runners
---
# =============================================================================
# Job to generate kubeconfig from ServiceAccount token
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-runner-kubeconfig-generator
  labels:
    app: forgejo-runner
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: kubeconfig-generator
      restartPolicy: Never
      containers:
        - name: kubeconfig-generator
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -ex

              # Validate RoleBinding exists and grants forgejo-runner-ci role
              echo "Validating RoleBinding..."
              ROLE_NAME=$(kubectl get rolebinding forgejo-runner-vm-ci -n forgejo-runners -o jsonpath='{.roleRef.name}')
              if [ "$ROLE_NAME" != "forgejo-runner-ci" ]; then
                echo "ERROR: RoleBinding does not grant forgejo-runner-ci role (got: $ROLE_NAME)"
                exit 1
              fi
              echo "✓ RoleBinding grants forgejo-runner-ci role"

              # Validate ServiceAccount token secret exists
              echo "Validating ServiceAccount token secret..."
              if ! kubectl get secret forgejo-runner-vm-token -n forgejo-runners &>/dev/null; then
                echo "ERROR: ServiceAccount token secret forgejo-runner-vm-token not found"
                exit 1
              fi
              echo "✓ ServiceAccount token secret exists"

              # Get cluster info - use API server from Kubernetes environment
              # VMs with macvtap networking can't reach ClusterIP addresses (10.96.0.1)
              # Use KUBERNETES_SERVICE variables available in every pod
              echo "Detecting API server endpoint..."
              SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"

              # Validate SERVER was detected
              if [ -z "$SERVER" ]; then
                echo "ERROR: Failed to detect API server URL"
                exit 1
              fi
              echo "Detected API server: $SERVER"

              # Validate SERVER is reachable
              echo "Testing API server connectivity..."
              HOST=$(echo "$SERVER" | sed 's|https://||' | sed 's|http://||' | cut -d: -f1)
              PORT=$(echo "$SERVER" | grep -o ':[0-9]*$' | tr -d ':')
              PORT=${PORT:-443}

              if ! timeout 5 bash -c "echo > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
                echo "ERROR: Cannot reach API server at $HOST:$PORT"
                echo "This endpoint is not accessible from this pod"
                exit 1
              fi
              echo "✓ API server is reachable at $HOST:$PORT"

              # Get ServiceAccount credentials
              CA_DATA=$(kubectl get secret forgejo-runner-vm-token -n forgejo-runners -o jsonpath='{.data.ca\.crt}')
              TOKEN=$(kubectl get secret forgejo-runner-vm-token -n forgejo-runners -o jsonpath='{.data.token}' | base64 -d)

              # Validate CA and token are not empty
              if [ -z "$CA_DATA" ]; then
                echo "ERROR: CA certificate is empty"
                exit 1
              fi
              if [ -z "$TOKEN" ]; then
                echo "ERROR: ServiceAccount token is empty"
                exit 1
              fi
              echo "✓ CA certificate and token extracted"

              # Generate kubeconfig
              cat > /tmp/kubeconfig <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority-data: ${CA_DATA}
                  server: ${SERVER}
                name: forgejo-runner-cluster
              contexts:
              - context:
                  cluster: forgejo-runner-cluster
                  namespace: forgejo-runners
                  user: forgejo-runner-vm
                name: forgejo-runner
              current-context: forgejo-runner
              users:
              - name: forgejo-runner-vm
                user:
                  token: ${TOKEN}
              EOF

              # Validate kubeconfig server is reachable
              echo "Validating API server connectivity..."
              if [ -z "$SERVER" ]; then
                echo "ERROR: Failed to get API server URL"
                exit 1
              fi
              echo "API Server: $SERVER"

              # Test that the kubeconfig can actually connect to the API
              # Use a namespace-scoped operation since we don't have cluster-wide permissions
              echo "Testing kubeconfig connectivity..."
              if ! KUBECONFIG=/tmp/kubeconfig kubectl get serviceaccount -n forgejo-runners --request-timeout=10s &>/dev/null; then
                echo "ERROR: Cannot connect to API server at $SERVER"
                echo "Generated kubeconfig failed connectivity test"
                exit 1
              fi
              echo "✓ API server is reachable (tested with kubectl get sa)"

              # Validate identity
              echo "Validating identity..."
              WHOAMI=$(KUBECONFIG=/tmp/kubeconfig kubectl auth whoami -o json)
              IDENTITY=$(echo "$WHOAMI" | jq -r '.status.userInfo.username')
              if [ "$IDENTITY" != "system:serviceaccount:forgejo-runners:forgejo-runner-vm" ]; then
                echo "ERROR: Identity mismatch (expected: system:serviceaccount:forgejo-runners:forgejo-runner-vm, got: $IDENTITY)"
                exit 1
              fi
              echo "✓ Identity verified: $IDENTITY"

              # List all permissions in forgejo-runners namespace
              echo "Listing all permissions in forgejo-runners namespace:"
              KUBECONFIG=/tmp/kubeconfig kubectl auth can-i --list -n forgejo-runners

              # Validate CI permissions with specific tests
              echo "Validating CI permissions..."

              # Should be able to create pods
              if ! KUBECONFIG=/tmp/kubeconfig kubectl auth can-i create pods -n forgejo-runners; then
                echo "ERROR: ServiceAccount cannot create pods in forgejo-runners namespace"
                exit 1
              fi
              echo "✓ Can create pods"

              # Should be able to delete jobs
              if ! KUBECONFIG=/tmp/kubeconfig kubectl auth can-i delete jobs -n forgejo-runners; then
                echo "ERROR: ServiceAccount cannot delete jobs in forgejo-runners namespace"
                exit 1
              fi
              echo "✓ Can delete jobs"

              # Should be able to read secrets (for testing)
              if ! KUBECONFIG=/tmp/kubeconfig kubectl auth can-i get secrets -n forgejo-runners; then
                echo "ERROR: ServiceAccount cannot read secrets in forgejo-runners namespace"
                exit 1
              fi
              echo "✓ Can read secrets"

              # Should NOT be able to create secrets (write-protected)
              if KUBECONFIG=/tmp/kubeconfig kubectl auth can-i create secrets -n forgejo-runners; then
                echo "ERROR: ServiceAccount CAN create secrets (should be denied)"
                exit 1
              fi
              echo "✓ Cannot create secrets (expected)"

              # Should NOT be able to create serviceaccounts (privilege escalation protection)
              if KUBECONFIG=/tmp/kubeconfig kubectl auth can-i create serviceaccounts -n forgejo-runners; then
                echo "ERROR: ServiceAccount CAN create serviceaccounts (privilege escalation risk)"
                exit 1
              fi
              echo "✓ Cannot create serviceaccounts (expected)"

              # Should NOT be able to create roles/rolebindings (RBAC modification protection)
              if KUBECONFIG=/tmp/kubeconfig kubectl auth can-i create roles -n forgejo-runners; then
                echo "ERROR: ServiceAccount CAN create roles (RBAC escalation risk)"
                exit 1
              fi
              echo "✓ Cannot create roles (expected)"

              if KUBECONFIG=/tmp/kubeconfig kubectl auth can-i create rolebindings -n forgejo-runners; then
                echo "ERROR: ServiceAccount CAN create rolebindings (RBAC escalation risk)"
                exit 1
              fi
              echo "✓ Cannot create rolebindings (expected)"

              echo "✓ CI permissions verified (least-privilege enforcement validated)"

              # Validate CANNOT access other namespaces
              echo "Validating namespace isolation..."
              if KUBECONFIG=/tmp/kubeconfig kubectl auth can-i list pods -n kube-system; then
                echo "ERROR: ServiceAccount has permissions outside forgejo-runners namespace (security violation)"
                exit 1
              fi
              echo "✓ Namespace isolation verified (cannot access other namespaces)"

              # Test a real operation in the namespace
              echo "Testing namespace access..."
              if ! KUBECONFIG=/tmp/kubeconfig kubectl get pods -n forgejo-runners --request-timeout=10s; then
                echo "ERROR: Cannot list pods in forgejo-runners namespace with generated kubeconfig"
                exit 1
              fi
              echo "✓ Namespace access verified (kubectl get pods succeeded)"

              # Create secret with kubeconfig
              kubectl create secret generic forgejo-runner-kubeconfig \
                -n forgejo-runners \
                --from-file=config=/tmp/kubeconfig \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "✓ Kubeconfig secret created: forgejo-runner-kubeconfig"
              echo "Success: Generated namespace-scoped kubeconfig with minimal CI permissions for forgejo-runner-vm ServiceAccount"
