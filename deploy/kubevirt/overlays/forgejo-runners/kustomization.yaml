apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: forgejo-runners

# =============================================================================
# Forgejo Runner Overlay
# =============================================================================
# Deploy: ./deploy.sh && kubectl apply -k .
#
# deploy.sh creates secrets with real values:
#   - forgejo-runner-userdata (cloud-init with CA, secret, URL)
#   - forgejo-runner-ssh-key (SSH public key for access)
#   - forgejo-runner-credentials (shared secret backup)
#
# VM waits for secrets before starting.
# =============================================================================

resources:
  - ../../base
  - runner-workspace-pvc.yaml

namespace: forgejo-runners

# Rename resources for this namespace
namePrefix: forgejo-

patches:
  # VM: Rename, add workspace PVC, adjust sizing
  - target:
      kind: VirtualMachine
      name: konductor
    path: virtualmachine.yaml

  # Job: Fix hardcoded resource names in kubeconfig generator script
  - target:
      kind: Job
      name: konductor-kubeconfig-generator
    path: kubeconfig-generator.yaml

  # ClusterRoleBinding: Update SA namespace
  - target:
      kind: ClusterRoleBinding
      name: konductor-vm-admin
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: forgejo-runners

  # Namespace: Rename from konductor to forgejo-runners
  - target:
      kind: Namespace
      name: konductor
    patch: |-
      - op: replace
        path: /metadata/name
        value: forgejo-runners

labels:
  - pairs:
      app.kubernetes.io/name: forgejo-runner
      app.kubernetes.io/component: ci-runner
      app.kubernetes.io/part-of: forgejo
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
