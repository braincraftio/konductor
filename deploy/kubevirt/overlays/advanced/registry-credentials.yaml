# =============================================================================
# Zot Registry Credentials
# =============================================================================
# CDI requires accessKeyId and secretKey format (not dockerconfigjson).
# Used by DataVolumeTemplate to pull images from private Zot registry.
#
# Reference: kubevirt/containerized-data-importer common/common.go
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: zot-registry-credentials
  labels:
    app: konductor
type: Opaque
stringData:
  accessKeyId: admin
  secretKey: admin
