# =============================================================================
# NetworkAttachmentDefinitions for Konductor on t640
# =============================================================================
# Two NADs for konductor VM networking:
#
#   1. macvtap: Direct L2 access to Intel 82599 10GbE (ens4f1)
#      - Konductor's primary network interface
#      - Gets DHCP IP address and default route
#      - High-performance passthrough to physical network
#
#   2. br0: Linux bridge for nested virtualization
#      - Connected to host's br0 Linux bridge (ens4f1 member)
#      - No IP address on this interface
#      - Used as uplink for konductor's internal br0 bridge
#      - Nested VMs attach to internal br0 for L2 network access
#
# t640 Network Architecture:
#   Physical: ens4f1 (Intel 82599 10GbE SFP+)
#   Host: br0 Linux bridge (ens4f1 as member, DHCP IP 192.168.1.41)
#   Cilium: Uses br0 as direct-routing-device
# =============================================================================
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: macvtap
  labels:
    app: konductor
  annotations:
    # t640: Broadcom BCM57416 10G RDMA (eno1np0) - dedicated for VM macvtap
    # ens4f1 is in br0 for Cilium/host networking, cannot be used for macvtap
    k8s.v1.cni.cncf.io/resourceName: macvtap.network.kubevirt.io/eno1np0
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "macvtap",
      "type": "macvtap",
      "mtu": 1500
    }
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: br0
  labels:
    app: konductor
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "br0",
      "type": "bridge",
      "bridge": "br0",
      "ipam": {}
    }
