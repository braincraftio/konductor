# =============================================================================
# VirtualMachine Patch - Advanced Configuration for t640
# =============================================================================
# Patches the base VM with:
#   - DataVolumeTemplate with persistent storage (imported from registry)
#   - Higher resources (16Gi RAM, 4 cores + hyperthreading)
#   - host-passthrough CPU for nested virtualization
#   - Pod interface for k8s API access
#   - macvtap interface (direct L2 to ens4f1 10GbE)
#   - Linux bridge interface (br0 for nested VM traffic)
#
# Network Architecture (inside VM):
#   enp1s0: macvtap → ens4f1 → DHCP IP, default route (konductor's network)
#   enp2s0: bridge → br0 → no IP → VM internal br0 → nested VMs
#   eth0:   pod network (masquerade) → k8s service/pod CIDRs
#
# Prerequisites:
#   - KubeVirt with CDI installed
#   - StorageClass: ceph-nvme-vm-block
#   - NetworkAttachmentDefinitions: macvtap, br0
#   - KubeVirt macvtap binding plugin enabled
# =============================================================================
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: konductor
spec:
  dataVolumeTemplates:
    - metadata:
        name: konductor-root
        labels:
          app: konductor
      spec:
        pvc:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 500Gi
          storageClassName: ceph-nvme-vm-block
        source:
          registry:
            url: docker://registry.c0a801c5.sslip.io/containercraft/konductor@sha256:17b65bfd10e2c19f04d07f8670694c086175a410de56c5bcff5f87d4a594b416
            secretRef: zot-registry-credentials
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: t640
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: konductor-ssh-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - usrbinkat
                  - kc2
                  - kc2admin
                  - runner
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 2
          model: host-passthrough
        resources:
          requests:
            memory: 16Gi
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          autoattachPodInterface: true
          autoattachSerialConsole: true
          autoattachGraphicsDevice: true
          networkInterfaceMultiqueue: true
          rng: {}
          disks:
            - name: root-disk
              bootOrder: 1
              cache: writeback
              disk:
                bus: virtio
            - name: git-disk
              serial: e4-root-775-h.Git
              disk:
                bus: virtio
            - name: home-disk-usrbinkat
              serial: e4-usrbinkat-700-h.u
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: kubeconfig
              serial: iso-root-755-m.kube
              disk:
                bus: virtio
          interfaces:
            # Pod network: For Kubernetes API/service access
            - name: default
              model: virtio
              masquerade: {}
            # macvtap: Direct L2 access to 10GbE physical NIC (ens4f1)
            # This is konductor's primary network - gets DHCP IP, default route
            - name: net-macvtap
              model: virtio
              macAddress: "52:54:00:c0:9d:01"
              binding:
                name: macvtap
            # Linux bridge: For nested virtualization
            # No IP on this interface - added to VM's internal br0
            - name: net-br0
              model: virtio
              bridge: {}
      networks:
        - name: default
          pod: {}
        - name: net-macvtap
          multus:
            networkName: macvtap
        - name: net-br0
          multus:
            networkName: br0
      volumes:
        - name: root-disk
          persistentVolumeClaim:
            claimName: konductor-root
        - name: git-disk
          persistentVolumeClaim:
            claimName: konductor-git
        - name: home-disk-usrbinkat
          persistentVolumeClaim:
            claimName: konductor-usrbinkat-home
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: konductor-userdata
            networkDataSecretRef:
              name: konductor-networkdata
        - name: kubeconfig
          secret:
            secretName: konductor-kubeconfig
            optional: true
