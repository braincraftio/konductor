# =============================================================================
# VirtualMachine Patch - Advanced Configuration
# =============================================================================
# Patches the base VM with:
#   - DataVolumeTemplate with persistent storage (imported from registry)
#   - Higher resources (16Gi RAM, 4 cores + hyperthreading)
#   - host-passthrough CPU for nested virtualization
#   - macvtap primary interface (direct L2 to physical NIC)
#   - OVS bridge secondary interface (for nested VMs)
#   - networkdata secret reference
#
# Prerequisites:
#   - KubeVirt with CDI installed
#   - StorageClass: ceph-nvme-vm-block (or modify below)
#   - NetworkAttachmentDefinitions: enp3s0-macvtap, ovs-br0
#   - KubeVirt macvtap binding plugin enabled
# =============================================================================
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: konductor
spec:
  dataVolumeTemplates:
    - metadata:
        name: konductor-root
        labels:
          app: konductor
      spec:
        pvc:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 120Gi
          storageClassName: ceph-nvme-vm-block
        source:
          registry:
            url: docker://registry.c0a801c5.sslip.io/containercraft/konductor@sha256:302254cb3af2816640894e185f3f7c7363440f6809e318d5327176ccbb3113bb
            # Using local Zot registry for faster image pulls and local development
            # pullMethod: node # Optional: pull to node first for better caching
            # Registry credentials - secret must exist in same namespace as VM
            secretRef: zot-registry-credentials
  template:
    spec:
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: konductor-ssh-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - usrbinkat
                  - kc2
                  - kc2admin
                  - runner
      domain:
        cpu:
          cores: 4
          sockets: 1
          threads: 2
          model: host-passthrough
        resources:
          requests:
            memory: 16Gi
        # EFI boot with OVMF firmware (qcow-efi image uses proper GPT alignment)
        firmware:
          bootloader:
            efi:
              secureBoot: false
        devices:
          autoattachPodInterface: true
          autoattachSerialConsole: true
          autoattachGraphicsDevice: true
          networkInterfaceMultiqueue: true
          rng: {}
          disks:
            - name: root-disk
              bootOrder: 1
              cache: writeback
              disk:
                bus: virtio
            - name: git-disk
              serial: e4-root-775-h.Git
              disk:
                bus: virtio
            - name: home-disk-usrbinkat
              serial: e4-usrbinkat-700-h.u
              disk:
                bus: virtio
            - name: cloudinitdisk
              disk:
                bus: virtio
            - name: kubeconfig
              serial: iso-root-755-m.kube
              disk:
                bus: virtio
          interfaces:
            # Pod network: For Kubernetes API access
            - name: default
              model: virtio
              masquerade: {}
            # macvtap: Direct L2 access to 10GbE physical NIC
            - name: enp1s0
              model: virtio
              macAddress: "02:00:00:c0:9d:01"
              binding:
                name: macvtap
            # OVS bridge: For nested virt (no IP)
            - name: enp2s0
              model: virtio
              bridge: {}
      networks:
        - name: default
          pod: {}
        - name: enp1s0
          multus:
            networkName: macvtap
        - name: enp2s0
          multus:
            networkName: br0
      volumes:
        - name: root-disk
          persistentVolumeClaim:
            claimName: konductor-root
        - name: git-disk
          persistentVolumeClaim:
            claimName: konductor-git
        - name: home-disk-usrbinkat
          persistentVolumeClaim:
            claimName: konductor-usrbinkat-home
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: konductor-userdata
            networkDataSecretRef:
              name: konductor-networkdata
        - name: kubeconfig
          secret:
            secretName: konductor-kubeconfig
            optional: true
