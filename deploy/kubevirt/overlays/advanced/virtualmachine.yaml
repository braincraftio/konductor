# =============================================================================
# VirtualMachine Patch - Advanced Configuration for t640
# =============================================================================
# Strategic merge patch that modifies base VM for dev workstation.
#
# IMPORTANT: Kustomize replaces arrays, it does not merge them.
# This patch must include ALL disks, interfaces, and volumes - both base
# elements AND additions - to produce a complete VM spec.
#
# Additions over base:
#   - Larger DataVolume storage (500Gi)
#   - Clone from golden image snapshot (instant provisioning)
#   - Node affinity (pin to t640)
#   - Personal PVC disks (workspace, home)
#   - Personal user in SSH key injection (usrbinkat)
#   - MAC address for macvtap interface
#
# Disk optimization for Rook Ceph NVMe block over RDMA:
#   - cache: none (bypass host cache, direct to Ceph)
#   - io: native (use native AIO for block devices)
#   - volumeMode: Block for optimal performance
# =============================================================================
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: konductor
spec:
  dataVolumeTemplates:
    - metadata:
        name: konductor-root
      spec:
        # Use spec.storage for CDI auto-inference from StorageProfile
        storage:
          accessModes:
            - ReadWriteOnce
          volumeMode: Block
          storageClassName: ceph-nvme-vm-block
          resources:
            requests:
              # Expand from golden image base size (64Gi) to full VM disk
              storage: 500Gi
        source:
          # Clone from golden image snapshot (instant, no registry import)
          snapshot:
            name: konductor-golden-snapshot
            namespace: konductor
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: t640
      accessCredentials:
        - sshPublicKey:
            source:
              secret:
                secretName: konductor-ssh-key
            propagationMethod:
              qemuGuestAgent:
                users:
                  - usrbinkat   # Deploy-time user (UID 1000)
                  - kc2
                  - kc2admin
                  - runner
      domain:
        devices:
          # ===================================================================
          # Disks - ALL disks (optimized for Rook Ceph NVMe block)
          # ===================================================================
          disks:
            # Base disks
            - name: root-disk
              bootOrder: 1
              cache: none
              io: native
              disk:
                bus: virtio
            - name: cloudinitdisk
              bootOrder: 2
              disk:
                bus: virtio
            - name: kubeconfig
              serial: iso-root-755-m.kube
              disk:
                bus: virtio
            # Additional disks for advanced overlay
            - name: workspace-disk
              serial: e4-usrbinkat-775-w
              cache: none
              io: native
              disk:
                bus: virtio
            - name: home-disk-usrbinkat
              serial: e4-usrbinkat-700-h.u
              cache: none
              io: native
              disk:
                bus: virtio
          # ===================================================================
          # Interfaces - ALL interfaces (base + modifications)
          # ===================================================================
          interfaces:
            - name: pod
              model: virtio
              masquerade: {}
            - name: macvtap
              model: virtio
              macAddress: "52:54:00:c0:9d:01"  # Unique MAC for this instance
              binding:
                name: macvtap
            - name: br0
              model: virtio
              bridge: {}
      # =======================================================================
      # Volumes - ALL volumes (base + additions)
      # =======================================================================
      volumes:
        # Base volumes
        - name: root-disk
          dataVolume:
            name: konductor-root
        - name: cloudinitdisk
          cloudInitNoCloud:
            secretRef:
              name: konductor-userdata
            networkDataSecretRef:
              name: konductor-networkdata
        - name: kubeconfig
          secret:
            secretName: konductor-kubeconfig
            optional: true
        # Additional volumes for advanced overlay
        - name: workspace-disk
          persistentVolumeClaim:
            claimName: konductor-workspace
        - name: home-disk-usrbinkat
          persistentVolumeClaim:
            claimName: konductor-usrbinkat-home
