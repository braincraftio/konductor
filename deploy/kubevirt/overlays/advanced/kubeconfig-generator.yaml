# =============================================================================
# Job to generate kubeconfig from ServiceAccount token
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: konductor-kubeconfig-generator
  labels:
    app: konductor
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      serviceAccountName: konductor-vm
      restartPolicy: Never
      containers:
        - name: kubeconfig-generator
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # Validate ClusterRoleBinding exists and grants cluster-admin
              echo "Validating ClusterRoleBinding..."
              ROLE_NAME=$(kubectl get clusterrolebinding konductor-vm-admin -o jsonpath='{.roleRef.name}')
              if [ "$ROLE_NAME" != "cluster-admin" ]; then
                echo "ERROR: ClusterRoleBinding does not grant cluster-admin role (got: $ROLE_NAME)"
                exit 1
              fi
              echo "✓ ClusterRoleBinding grants cluster-admin"

              # Validate ServiceAccount token secret exists
              echo "Validating ServiceAccount token secret..."
              if ! kubectl get secret konductor-vm-token -n konductor &>/dev/null; then
                echo "ERROR: ServiceAccount token secret konductor-vm-token not found"
                exit 1
              fi
              echo "✓ ServiceAccount token secret exists"

              # Get cluster info - use API server from Kubernetes environment
              # VMs with macvtap networking can't reach ClusterIP addresses (10.96.0.1)
              # Use KUBERNETES_SERVICE variables available in every pod
              echo "Detecting API server endpoint..."
              SERVER="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT}"

              # Validate SERVER was detected
              if [ -z "$SERVER" ]; then
                echo "ERROR: Failed to detect API server URL"
                exit 1
              fi
              echo "Detected API server: $SERVER"

              # Validate SERVER is reachable
              echo "Testing API server connectivity..."
              HOST=$(echo "$SERVER" | sed 's|https://||' | sed 's|http://||' | cut -d: -f1)
              PORT=$(echo "$SERVER" | grep -o ':[0-9]*$' | tr -d ':')
              PORT=${PORT:-443}

              if ! timeout 5 bash -c "echo > /dev/tcp/$HOST/$PORT" 2>/dev/null; then
                echo "ERROR: Cannot reach API server at $HOST:$PORT"
                echo "This endpoint is not accessible from this pod"
                exit 1
              fi
              echo "✓ API server is reachable at $HOST:$PORT"

              # Get ServiceAccount credentials
              CA_DATA=$(kubectl get secret konductor-vm-token -n konductor -o jsonpath='{.data.ca\.crt}')
              TOKEN=$(kubectl get secret konductor-vm-token -n konductor -o jsonpath='{.data.token}' | base64 -d)

              # Validate CA and token are not empty
              if [ -z "$CA_DATA" ]; then
                echo "ERROR: CA certificate is empty"
                exit 1
              fi
              if [ -z "$TOKEN" ]; then
                echo "ERROR: ServiceAccount token is empty"
                exit 1
              fi
              echo "✓ CA certificate and token extracted"

              # Generate kubeconfig
              cat > /tmp/kubeconfig <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority-data: ${CA_DATA}
                  server: ${SERVER}
                name: konductor-cluster
              contexts:
              - context:
                  cluster: konductor-cluster
                  namespace: konductor
                  user: konductor-vm
                name: konductor
              current-context: konductor
              users:
              - name: konductor-vm
                user:
                  token: ${TOKEN}
              EOF

              # Validate kubeconfig server is reachable
              echo "Validating API server connectivity..."
              if [ -z "$SERVER" ]; then
                echo "ERROR: Failed to get API server URL"
                exit 1
              fi
              echo "API Server: $SERVER"

              # Test that the kubeconfig can actually connect to the API
              echo "Testing kubeconfig connectivity..."
              if ! KUBECONFIG=/tmp/kubeconfig kubectl cluster-info --request-timeout=10s &>/dev/null; then
                echo "ERROR: Cannot connect to API server at $SERVER"
                echo "This kubeconfig will not work from VMs on macvtap networking"
                exit 1
              fi
              echo "✓ API server is reachable"

              # Validate identity
              echo "Validating identity..."
              WHOAMI=$(KUBECONFIG=/tmp/kubeconfig kubectl auth whoami -o json)
              IDENTITY=$(echo "$WHOAMI" | jq -r '.status.userInfo.username')
              if [ "$IDENTITY" != "system:serviceaccount:konductor:konductor-vm" ]; then
                echo "ERROR: Identity mismatch (expected: system:serviceaccount:konductor:konductor-vm, got: $IDENTITY)"
                exit 1
              fi
              echo "✓ Identity verified: $IDENTITY"

              # Validate cluster-admin permissions
              echo "Validating cluster-admin permissions..."
              if ! KUBECONFIG=/tmp/kubeconfig kubectl auth can-i '*' '*' --all-namespaces &>/dev/null; then
                echo "ERROR: ServiceAccount does not have cluster-admin permissions"
                exit 1
              fi
              echo "✓ cluster-admin permissions verified"

              # Test a real operation to ensure it works end-to-end
              echo "Testing cluster access..."
              if ! KUBECONFIG=/tmp/kubeconfig kubectl get nodes --request-timeout=10s &>/dev/null; then
                echo "ERROR: Cannot list nodes with generated kubeconfig"
                exit 1
              fi
              echo "✓ Cluster access verified (kubectl get nodes succeeded)"

              # Create secret with kubeconfig
              kubectl create secret generic konductor-kubeconfig \
                -n konductor \
                --from-file=config=/tmp/kubeconfig \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "✓ Kubeconfig secret created: konductor-kubeconfig"
              echo "Success: Generated kubeconfig with cluster-admin access for konductor-vm ServiceAccount"
