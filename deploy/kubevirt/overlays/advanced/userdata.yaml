# =============================================================================
# User Data Patch - Advanced Configuration
# =============================================================================
# Patches base userdata with:
#   - systemd-networkd bridge configuration files
#   - ARP/MAC learning commands for physical network
#   - Power management sudoers for kc2 user
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: konductor-userdata
stringData:
  userdata: |
    #cloud-config
    # Konductor Advanced Development VM Cloud-Init Configuration
    # =========================================================================
    # SSH Key Injection:
    #   Keys are injected at runtime via QEMU Guest Agent.
    #   Create secret: kubectl create secret generic konductor-ssh-key \
    #     -n konductor --from-file=key=$HOME/.ssh/id_ed25519.pub
    # =========================================================================

    # -------------------------------------------------------------------------
    # Disk Resize Configuration
    # -------------------------------------------------------------------------
    # Force resize root partition and filesystem on every boot (PER_ALWAYS)
    # Allows DataVolume storage size increases to take effect
    growpart:
      mode: auto
      devices: ["/"]
      ignore_growroot_disabled: true
    resize_rootfs: true

    # -------------------------------------------------------------------------
    # User Configuration
    # -------------------------------------------------------------------------
    # UIDs: usrbinkat(1000) added via cloud-init
    # Image has: kc2(1001), kc2admin(1002), runner(1003) baked in
    # All users share kc2 group (GID 1001) for shared directory access
    # SSH keypairs generated via runcmd for outbound SSH from VM
    users:
      - name: usrbinkat
        uid: 1000
        gecos: Primary User
        groups: kc2, wheel, docker, libvirtd, kvm
        shell: /run/current-system/sw/bin/bash
        sudo: ALL=(ALL) NOPASSWD:ALL
        lock_passwd: true

    # -------------------------------------------------------------------------
    # Filesystem Setup
    # -------------------------------------------------------------------------
    # Format persistent disks on first boot (idempotent - checks existing label)
    # Mounting is handled by konductor-mount@.service (systemd template)
    #
    # Serial ID format: <fstype>-<user>-<mode>-<path>
    #   e4-root-775-h.Git      → /dev/disk/by-id/virtio-e4-root-775-h.Git
    #   e4-usrbinkat-700-h.u   → /dev/disk/by-id/virtio-e4-usrbinkat-700-h.u
    fs_setup:
      - label: git
        filesystem: ext4
        device: /dev/disk/by-id/virtio-e4-root-775-h.Git
        partition: none
        overwrite: false
      - label: home-usrbinkat
        filesystem: ext4
        device: /dev/disk/by-id/virtio-e4-usrbinkat-700-h.u
        partition: none
        overwrite: false

    # -------------------------------------------------------------------------
    # Configuration Files
    # -------------------------------------------------------------------------
    write_files:
      # Allow kc2 to poweroff/reboot without sudo password
      - path: /etc/sudoers.d/kc2-power
        content: |
          kc2 ALL=(ALL) NOPASSWD: /run/current-system/sw/bin/poweroff, /run/current-system/sw/bin/reboot, /run/current-system/sw/bin/shutdown
        permissions: '0440'
      # Containers policy for skopeo/podman
      - path: /etc/containers/policy.json
        content: |
          {"default": [{"type": "insecureAcceptAnything"}]}
        permissions: '0644'
      # Docker CA cert for local registry (Optiplex Lab cluster CA)
      - path: /etc/docker/certs.d/registry.c0a801c5.sslip.io/ca.crt
        content: |
          -----BEGIN CERTIFICATE-----
          MIIB6TCCAY6gAwIBAgIUWB2ggBMLM5bM4/7LLgaN2s8VEi4wCgYIKoZIzj0EAwIw
          UjEQMA4GA1UEChMHQ2x1c3RlcjEXMBUGA1UECxMOSW5mcmFzdHJ1Y3R1cmUxJTAj
          BgNVBAMTHE9wdGlwbGV4IExhYiBDbHVzdGVyIFJvb3QgQ0EwHhcNMjUxMjE1MDI0
          MjA4WhcNMjYxMjE1MDI0MjA4WjBSMRAwDgYDVQQKEwdDbHVzdGVyMRcwFQYDVQQL
          Ew5JbmZyYXN0cnVjdHVyZTElMCMGA1UEAxMcT3B0aXBsZXggTGFiIENsdXN0ZXIg
          Um9vdCBDQTBZMBMGByqGSM49AgEGCCqGSM49AwEHA0IABMIcKzXnUQZsKcb9ujVP
          He3s359FzEtAKDtCgTbO5w2Cn+S/RG1NtPLanuIYTALZgRxZbCXX7dHuFS/DgiaL
          HX+jQjBAMA4GA1UdDwEB/wQEAwICpDAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQW
          BBSEaGRSSq84F+IQQUJv3w0vaCj2/jAKBggqhkjOPQQDAgNJADBGAiEA3wDkcYqi
          bB9/h5b8KnJeOqEr7XwGThT3nqOhILW6jRcCIQD8ppAvMjmOQ4b7IOd6RMAwbZ6A
          +u4NbhqCQsa4UabgHQ==
          -----END CERTIFICATE-----
        permissions: '0644'
      # Create br0 bridge device (cloud-init v2 doesn't create .netdev)
      - path: /etc/systemd/network/05-br0.netdev
        content: |
          [NetDev]
          Name=br0
          Kind=bridge

          [Bridge]
          STP=false
          ForwardDelaySec=0
        permissions: '0644'
      # Configure br0 with no IP
      - path: /etc/systemd/network/05-br0.network
        content: |
          [Match]
          Name=br0

          [Network]
          DHCP=no
          IPv6AcceptRA=no
          LinkLocalAddressing=no
        permissions: '0644'
      # Configure enp3s0 as br0 port with no IP
      - path: /etc/systemd/network/05-enp3s0.network
        content: |
          [Match]
          Name=enp3s0

          [Network]
          Bridge=br0
          DHCP=no
          IPv6AcceptRA=no
          LinkLocalAddressing=no

          [Link]
          RequiredForOnline=no
        permissions: '0644'

    # -------------------------------------------------------------------------
    # Startup Commands
    # -------------------------------------------------------------------------
    # Note: NixOS requires full paths - binaries in /run/current-system/sw/bin
    runcmd:
      # -----------------------------------------------------------------------
      # Generate SSH keys for users
      # -----------------------------------------------------------------------
      - [/run/current-system/sw/bin/mkdir, -p, /home/usrbinkat/.ssh]
      - [/run/current-system/sw/bin/ssh-keygen, -t, ed25519, -f, /home/usrbinkat/.ssh/id_ed25519, -N, "", -q]
      - [/run/current-system/sw/bin/chmod, "700", /home/usrbinkat/.ssh]
      - [/run/current-system/sw/bin/chmod, "600", /home/usrbinkat/.ssh/id_ed25519]
      - [/run/current-system/sw/bin/chown, -R, "usrbinkat:kc2", /home/usrbinkat/.ssh]

      - [/run/current-system/sw/bin/mkdir, -p, /home/kc2/.ssh]
      - [/run/current-system/sw/bin/ssh-keygen, -t, ed25519, -f, /home/kc2/.ssh/id_ed25519, -N, "", -q]
      - [/run/current-system/sw/bin/chmod, "700", /home/kc2/.ssh]
      - [/run/current-system/sw/bin/chmod, "600", /home/kc2/.ssh/id_ed25519]
      - [/run/current-system/sw/bin/chown, -R, "kc2:kc2", /home/kc2/.ssh]

      - [/run/current-system/sw/bin/mkdir, -p, /home/kc2admin/.ssh]
      - [/run/current-system/sw/bin/ssh-keygen, -t, ed25519, -f, /home/kc2admin/.ssh/id_ed25519, -N, "", -q]
      - [/run/current-system/sw/bin/chmod, "700", /home/kc2admin/.ssh]
      - [/run/current-system/sw/bin/chmod, "600", /home/kc2admin/.ssh/id_ed25519]
      - [/run/current-system/sw/bin/chown, -R, "kc2admin:kc2", /home/kc2admin/.ssh]

      # -----------------------------------------------------------------------
      # Mount persistent volumes via systemd template service
      # -----------------------------------------------------------------------
      # konductor-mount@.service parses serial ID to mount:
      #   Serial ID format: <fstype>-<user>-<mode>-<path>
      #   Path encoding: dots become slashes, abbreviations expand:
      #     h = home, m = mnt, u = $OWNER (the user field)
      #
      #   e4-root-775-h.Git      → /home/Git (ext4, root:kc2, 775)
      #   e4-usrbinkat-700-h.u   → /home/usrbinkat (ext4, usrbinkat:kc2, 700)
      #   iso-root-755-m.kube    → /mnt/kube (iso9660 ro, root:root, 755)
      #
      # Note: Serial IDs limited to 20 chars, abbreviations save space
      # -----------------------------------------------------------------------
      - [/run/current-system/sw/bin/systemctl, enable, --now, konductor-mount@e4-root-775-h.Git.service]
      - [/run/current-system/sw/bin/systemctl, enable, --now, konductor-mount@e4-usrbinkat-700-h.u.service]
      - [/run/current-system/sw/bin/systemctl, enable, --now, konductor-mount@iso-root-755-m.kube.service]

      # Restart networkd to apply bridge config
      - [/run/current-system/sw/bin/systemctl, restart, systemd-networkd]

      # Force ARP/MAC learning by pinging gateway and sending gratuitous ARP on physical interface
      - [sh, -c, "sleep 5 && /run/current-system/sw/bin/ping -c 5 $(ip route | awk '/default/ {print $3}' | head -1) || true"]
      - [sh, -c, "/run/current-system/sw/bin/arping -c 3 -U -I enp3s0 $(ip -4 addr show enp3s0 | awk '/inet / {print $2}' | cut -d/ -f1) 2>/dev/null || true"]

      # Copy kubeconfig to user directories
      # Mount point is /m/kube (from serial iso-root-755-m.kube: m.kube → /m/kube)
      - [/run/current-system/sw/bin/mkdir, -p, /home/usrbinkat/.kube, /home/kc2/.kube, /home/kc2admin/.kube]
      - [/run/current-system/sw/bin/cp, /m/kube/config, /home/usrbinkat/.kube/config]
      - [/run/current-system/sw/bin/cp, /m/kube/config, /home/kc2/.kube/config]
      - [/run/current-system/sw/bin/cp, /m/kube/config, /home/kc2admin/.kube/config]
      - [/run/current-system/sw/bin/chown, -R, "usrbinkat:kc2", /home/usrbinkat/.kube]
      - [/run/current-system/sw/bin/chown, -R, "kc2:kc2", /home/kc2/.kube]
      - [/run/current-system/sw/bin/chown, -R, "kc2admin:kc2", /home/kc2admin/.kube]
      - [/run/current-system/sw/bin/chmod, "600", /home/usrbinkat/.kube/config]
      - [/run/current-system/sw/bin/chmod, "600", /home/kc2/.kube/config]
      - [/run/current-system/sw/bin/chmod, "600", /home/kc2admin/.kube/config]

      # Start services
      - [/run/current-system/sw/bin/systemctl, start, docker]
      - [/run/current-system/sw/bin/systemctl, start, libvirtd]

    final_message: |
      Cloud-Init Complete
      VM: konductor (advanced)
      Access: ssh kc2@<IP> or ssh kc2admin@<IP>
      Environment: Full Konductor toolchain pre-installed with persistent storage
