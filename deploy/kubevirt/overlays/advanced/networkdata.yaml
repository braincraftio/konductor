# =============================================================================
# Network Data Secret - Advanced Configuration
# =============================================================================
# Cloud-init v2 network configuration for dual-NIC setup:
#   - enp1s0: Primary interface with DHCP (macvtap to physical NIC)
#   - enp2s0: Secondary interface as br0 bridge slave (for nested virt)
#   - br0: Bridge device with no IP (used by nested VMs)
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: konductor-networkdata
  labels:
    app: konductor
type: Opaque
stringData:
  networkdata: |
    version: 2
    renderer: networkd
    ethernets:
      enp1s0:
        # Pod network interface - for Kubernetes API access
        # KubeVirt masquerade networking always uses 10.0.2.1 as gateway
        dhcp4: true
        dhcp6: false
        routes:
          # Route Kubernetes service CIDR through pod network gateway
          - to: 10.96.0.0/12
            via: 10.0.2.1
            metric: 100
          # Route pod CIDR through pod network gateway
          - to: 10.244.0.0/16
            via: 10.0.2.1
            metric: 100
        dhcp4-overrides:
          route-metric: 200
      enp3s0:
        # macvtap - physical network (default route)
        dhcp4: true
        dhcp6: false
        dhcp-identifier: mac
        dhcp4-overrides:
          route-metric: 300
      enp2s0:
        # OVS bridge slave - no IP
        dhcp4: false
        dhcp6: false
        link-local: []
        optional: true
    bridges:
      br0:
        interfaces:
          - enp2s0
        dhcp4: false
        dhcp6: false
        link-local: []
        parameters:
          stp: false
          forward-delay: 0
