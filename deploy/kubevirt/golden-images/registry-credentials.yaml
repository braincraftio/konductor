# =============================================================================
# Registry Credentials for Golden Image Import
# =============================================================================
# CDI uses generic secrets with accessKeyId/secretKey fields (not dockerconfigjson).
#
# Alternative creation methods:
#   kubectl create secret generic zot-registry-credentials \
#     --from-literal=accessKeyId=admin \
#     --from-literal=secretKey=admin \
#     -n konductor
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: zot-registry-credentials
  namespace: konductor
  labels:
    app.kubernetes.io/name: zot-registry-credentials
    app.kubernetes.io/component: golden-image
    app.kubernetes.io/part-of: konductor
type: Opaque
stringData:
  # CDI expects accessKeyId (username) and secretKey (password)
  accessKeyId: admin
  secretKey: admin
