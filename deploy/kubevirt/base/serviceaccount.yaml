# =============================================================================
# ServiceAccount for Konductor VM kubectl access
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: konductor-vm
  labels:
    app: konductor
---
apiVersion: v1
kind: Secret
metadata:
  name: konductor-vm-token
  labels:
    app: konductor
  annotations:
    kubernetes.io/service-account.name: konductor-vm
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: konductor-vm-admin
  labels:
    app: konductor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: konductor-vm
    namespace: konductor
