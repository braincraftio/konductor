---
# Validate Konductor CI Environment
#
# Tests that the runner has all required tools, environment variables,
# and resources for QCOW2 builds. Mirrors _build:qcow2:preflight checks.
#
# This workflow validates:
# 1. Forked runner workspace isolation (WORKSPACE_ROOT, workspace.git clone)
# 2. direnv integration (.envrc chain with source_up)
# 3. Required binaries, firmware, KVM, Docker, Nix
# 4. System resources (disk, memory, CPU)

name: Validate Environment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: CI Environment Validation
    runs-on: konductor
    timeout-minutes: 10

    steps:
      - name: Pre-checkout Environment Audit
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  RAW ENVIRONMENT AUDIT (pre-checkout, pre-direnv)"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "--- Critical Paths ---"
          echo "WORKSPACE_ROOT=${WORKSPACE_ROOT:-<NOT SET>}"
          echo "PWD=${PWD}"
          echo "HOME=${HOME}"
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-<NOT SET>}"
          echo ""
          echo "--- Variables that SHOULD be set after direnv ---"
          echo "QCOW2_BUILD_FILE=${QCOW2_BUILD_FILE:-<NOT SET>}"
          echo "KUBECONFIG=${KUBECONFIG:-<NOT SET>}"
          echo "CONTAINER_REGISTRY=${CONTAINER_REGISTRY:-<NOT SET>}"
          echo "KONDUCTOR_SHELL=${KONDUCTOR_SHELL:-<NOT SET>}"
          echo ""

      - name: Runner Identity
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  Konductor CI Environment Validation"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "Runner:"
          echo "  Hostname: $(hostname)"
          echo "  User: $(whoami)"
          echo "  UID: $(id -u)"
          echo "  Groups: $(groups)"
          echo "  Date: $(date -Iseconds)"
          echo "  Kernel: $(uname -r)"
          echo ""

      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Forked Runner
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  Forked Runner Validation"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "Runner version:"
          forgejo-runner --version
          RUNNER_VERSION=$(forgejo-runner --version 2>&1)
          if echo "$RUNNER_VERSION" | rg -q "braincraft"; then
            echo "✓ Running forked runner with workspace features"
          else
            echo "✗ Not running forked runner (expected 'braincraft' in version)"
            echo "  Got: $RUNNER_VERSION"
            exit 1
          fi

      - name: Validate Workspace Structure
        env:
          GIT_PAGER: cat
          PAGER: cat
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  Workspace Structure (include_server_host feature)"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "PWD: $(pwd)"
          echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT:-<NOT SET>}"
          echo ""

          # WORKSPACE_ROOT must be set by the runner
          if [ -z "${WORKSPACE_ROOT:-}" ]; then
            echo "✗ WORKSPACE_ROOT not set"
            echo "  The forked runner should set WORKSPACE_ROOT to the org directory"
            echo "  Check runner config: container.include_server_host and container.workspace_repo"
            exit 1
          fi

          # Critical: WORKSPACE_ROOT must be a git repo (workspace cloning feature)
          echo "Validating workspace repo clone..."
          if git -C "${WORKSPACE_ROOT}" rev-parse --git-dir >/dev/null 2>&1; then
            echo "✓ WORKSPACE_ROOT is a git repo (workspace cloning working)"
            echo ""
            echo "Workspace repo:"
            git -C "${WORKSPACE_ROOT}" remote -v
            git -C "${WORKSPACE_ROOT}" log --oneline -n 3
          else
            echo "✗ WORKSPACE_ROOT is not a git repo"
            echo "  The forked runner should clone the workspace repo to WORKSPACE_ROOT"
            echo "  Check runner config: container.include_server_host and container.workspace_repo"
            echo ""
            echo "Current WORKSPACE_ROOT contents:"
            ls -la "${WORKSPACE_ROOT}" 2>/dev/null || echo "  (directory not found)"
            exit 1
          fi
          echo ""

          # Verify .envrc files exist in the chain
          echo "Checking .envrc chain for direnv integration:"
          if [ -f "${WORKSPACE_ROOT}/.envrc" ]; then
            echo "✓ ${WORKSPACE_ROOT}/.envrc exists (parent)"
          else
            echo "✗ ${WORKSPACE_ROOT}/.envrc missing"
          fi
          if [ -f "${WORKSPACE_ROOT}/k9/.envrc" ]; then
            echo "✓ ${WORKSPACE_ROOT}/k9/.envrc exists (child)"
          else
            echo "✗ ${WORKSPACE_ROOT}/k9/.envrc missing"
          fi
          echo ""

          echo "Workspace structure:"
          tree -L 2 -a "${WORKSPACE_ROOT}" 2>/dev/null | head -40 || ls -la "${WORKSPACE_ROOT}"

      - name: Setup direnv Environment
        id: direnv
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  direnv Environment Setup"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""

          # Verify direnv is available
          echo "direnv version: $(direnv --version)"
          echo ""

          # Allow .envrc files in the chain (parent first, then child)
          echo "Allowing .envrc files..."
          direnv allow "${WORKSPACE_ROOT}"
          echo "✓ Allowed: ${WORKSPACE_ROOT}/.envrc"

          direnv allow "${WORKSPACE_ROOT}/k9"
          echo "✓ Allowed: ${WORKSPACE_ROOT}/k9/.envrc"
          echo ""

          # cd to the repo directory (innermost .envrc with source_up)
          cd "${WORKSPACE_ROOT}/k9"
          echo "Working directory: $(pwd)"
          echo ""

          # Export direnv environment as JSON and convert to GITHUB_ENV format
          echo "Exporting direnv environment to GITHUB_ENV..."
          DIRENV_JSON=$(direnv export json 2>/dev/null || echo "{}")

          if [ "$DIRENV_JSON" = "{}" ] || [ -z "$DIRENV_JSON" ]; then
            echo "⚠ direnv export returned empty (no .envrc changes?)"
            echo ""
            echo "Debug: direnv status"
            direnv status
          else
            # Parse JSON and write to GITHUB_ENV
            # Filter: strings only, no newlines, no shell code patterns
            # Use heredoc syntax for safety with special characters
            echo "$DIRENV_JSON" | jq -r '
              to_entries[]
              | select(.value | type == "string")
              | select(.value | contains("\n") | not)
              | select(.value | test("^\\s*(echo|if|then|else|fi|for|while|do|done|case|esac|function)\\s") | not)
              | "\(.key)<<EOF\n\(.value)\nEOF"
            ' >> $GITHUB_ENV

            # Count exported variables
            VAR_COUNT=$(echo "$DIRENV_JSON" | jq 'to_entries | map(select(.value | type == "string") | select(.value | contains("\n") | not)) | length')
            echo "✓ Exported ${VAR_COUNT} environment variables to GITHUB_ENV"
          fi
          echo ""

          # Show key variables that should now be set
          echo "Key variables from direnv:"
          echo "$DIRENV_JSON" | jq -r '
            to_entries[]
            | select(.key | test("QCOW2_|CONTAINER_|REGISTRY_|KUBECONFIG|KONDUCTOR_|WORKSPACE_ROOT"))
            | "  \(.key)=\(.value | tostring | .[0:60])"
          ' 2>/dev/null || echo "  (none found)"

      - name: Validate direnv Environment
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  direnv Environment Validation (post-export)"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          ERRORS=0

          # These should now be set from .envrc -> .env.example
          echo "--- Variables from direnv (.envrc chain) ---"

          if [ -n "${QCOW2_BUILD_FILE:-}" ]; then
            echo "✓ QCOW2_BUILD_FILE=${QCOW2_BUILD_FILE}"
          else
            echo "✗ QCOW2_BUILD_FILE not set (expected from .env.example)"
            ((ERRORS++))
          fi

          if [ -n "${CONTAINER_REGISTRY:-}" ]; then
            echo "✓ CONTAINER_REGISTRY=${CONTAINER_REGISTRY}"
          else
            echo "✗ CONTAINER_REGISTRY not set (expected from .env.example)"
            ((ERRORS++))
          fi

          if [ -n "${CONTAINER_IMAGE:-}" ]; then
            echo "✓ CONTAINER_IMAGE=${CONTAINER_IMAGE}"
          else
            echo "✗ CONTAINER_IMAGE not set (expected from .env.example)"
            ((ERRORS++))
          fi

          # KUBECONFIG is derived from WORKSPACE_ROOT in .envrc
          if [ -n "${KUBECONFIG:-}" ]; then
            echo "✓ KUBECONFIG=${KUBECONFIG}"
          else
            echo "⚠ KUBECONFIG not set (derived from WORKSPACE_ROOT in .envrc)"
          fi

          echo ""
          echo "--- QCOW2 Build Variables ---"
          printf "  QCOW2_BUILD_FILE=%s\n" "${QCOW2_BUILD_FILE:-<not set>}"
          printf "  QCOW2_SSH_PORT=%s\n" "${QCOW2_SSH_PORT:-<not set>}"
          printf "  QCOW2_VM_MEMORY=%s\n" "${QCOW2_VM_MEMORY:-<not set>}"
          printf "  QCOW2_VM_CPUS=%s\n" "${QCOW2_VM_CPUS:-<not set>}"
          printf "  QCOW2_REQUIRED_BINS=%s\n" "${QCOW2_REQUIRED_BINS:-<not set>}"

          echo ""
          echo "--- Container/Registry Variables ---"
          printf "  CONTAINER_REGISTRY=%s\n" "${CONTAINER_REGISTRY:-<not set>}"
          printf "  CONTAINER_IMAGE=%s\n" "${CONTAINER_IMAGE:-<not set>}"
          printf "  CONTAINER_TAG=%s\n" "${CONTAINER_TAG:-<not set>}"
          printf "  REGISTRY_USERNAME=%s\n" "${REGISTRY_USERNAME:-<not set>}"

          echo ""
          if [ "$ERRORS" -gt 0 ]; then
            echo "⚠ ${ERRORS} expected variable(s) not set by direnv"
            echo "  Check .envrc and .env.example files"
            # Don't fail - this is informational for now
          else
            echo "✓ All expected direnv variables are set"
          fi

      - name: Validate Required Binaries
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  Required Binaries (QCOW2_REQUIRED_BINS)"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          ERRORS=0
          BINS="nix qemu-img qemu-system-x86_64 genisoimage guestmount"
          BINS+=" guestunmount virt-sparsify ssh rsync timeout ss"
          BINS+=" dust sha256sum jq docker skopeo direnv"
          for cmd in $BINS; do
            if command -v "$cmd" &>/dev/null; then
              path=$(command -v "$cmd")
              printf "✓ %-25s %s\n" "$cmd" "$path"
            else
              printf "✗ %-25s NOT FOUND\n" "$cmd"
              ((ERRORS++))
            fi
          done
          echo ""
          [ "$ERRORS" -eq 0 ] || { echo "ERROR: $ERRORS required binary(s) missing"; exit 1; }
          echo "All required binaries present"

      - name: Validate CI Tool Versions
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  Tool Versions"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "Nix:"
          nix --version
          echo ""
          echo "QEMU:"
          qemu-system-x86_64 --version | head -3
          echo ""
          echo "Docker:"
          docker --version
          echo ""
          echo "Skopeo:"
          skopeo --version
          echo ""
          echo "direnv:"
          direnv --version
          echo ""
          echo "Languages:"
          printf "  Python: %s\n" "$(python3 --version 2>&1)"
          printf "  Go:     %s\n" "$(go version 2>&1)"
          printf "  Node:   %s\n" "$(node --version 2>&1)"
          printf "  Rust:   %s\n" "$(rustc --version 2>&1)"
          echo ""

      - name: Validate OVMF Firmware
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  OVMF EFI Firmware"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          ERRORS=0

          # OVMF_CODE (from NixOS sessionVariables)
          if [ -n "${OVMF_CODE:-}" ] && [ -f "$OVMF_CODE" ]; then
            printf "✓ OVMF_CODE=%s\n" "$OVMF_CODE"
            ls -lh "$OVMF_CODE"
          else
            printf "✗ OVMF_CODE='%s' (not set or file missing)\n" "${OVMF_CODE:-}"
            ((ERRORS++))
          fi
          echo ""

          # OVMF_VARS (from NixOS sessionVariables)
          if [ -n "${OVMF_VARS:-}" ] && [ -f "$OVMF_VARS" ]; then
            printf "✓ OVMF_VARS=%s\n" "$OVMF_VARS"
            ls -lh "$OVMF_VARS"
          else
            printf "✗ OVMF_VARS='%s' (not set or file missing)\n" "${OVMF_VARS:-}"
            ((ERRORS++))
          fi
          echo ""
          [ "$ERRORS" -eq 0 ] || { echo "ERROR: OVMF firmware not configured"; exit 1; }

      - name: Validate KVM Access
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  KVM Virtualization"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          if [ -c /dev/kvm ]; then
            echo "✓ /dev/kvm exists"
            ls -la /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "✓ /dev/kvm readable and writable"
            else
              echo "✗ /dev/kvm not accessible (check group membership)"
              exit 1
            fi
          else
            echo "✗ /dev/kvm not found (nested virtualization not enabled?)"
            exit 1
          fi
          echo ""

      - name: Validate System Resources
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  System Resources"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          ERRORS=0
          MIN_DISK_GB=100
          MIN_MEM_MB=8192

          # Disk space
          DISK_AVAIL_GB=$(df -BG --output=avail . | tail -1 | tr -d ' G')
          if [ "$DISK_AVAIL_GB" -ge "$MIN_DISK_GB" ]; then
            printf "✓ Disk: %sGB available (minimum: %sGB)\n" "$DISK_AVAIL_GB" "$MIN_DISK_GB"
          else
            printf "✗ Disk: %sGB available (minimum: %sGB)\n" "$DISK_AVAIL_GB" "$MIN_DISK_GB"
            ((ERRORS++))
          fi

          # Memory
          MEM_AVAIL_MB=$(awk '/MemAvailable/ {print int($2/1024)}' /proc/meminfo)
          MEM_TOTAL_MB=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          if [ "$MEM_AVAIL_MB" -ge "$MIN_MEM_MB" ]; then
            printf "✓ Memory: %sMB available / %sMB total (min: %sMB)\n" \
              "$MEM_AVAIL_MB" "$MEM_TOTAL_MB" "$MIN_MEM_MB"
          else
            printf "✗ Memory: %sMB available / %sMB total (min: %sMB)\n" \
              "$MEM_AVAIL_MB" "$MEM_TOTAL_MB" "$MIN_MEM_MB"
            ((ERRORS++))
          fi

          # CPUs
          CPUS=$(nproc)
          printf "✓ CPUs: %s\n" "$CPUS"
          echo ""

          echo "Disk usage:"
          df -h / /nix 2>/dev/null || df -h /
          echo ""

          [ "$ERRORS" -eq 0 ] || { echo "ERROR: Insufficient system resources"; exit 1; }

      - name: Validate Docker
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  Docker Runtime"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""

          # Docker socket
          if [ -S "${DOCKER_HOST#unix://}" ] || [ -S /var/run/docker.sock ]; then
            echo "✓ Docker socket accessible"
          else
            echo "✗ Docker socket not found"
            exit 1
          fi

          # Docker daemon
          if docker info &>/dev/null; then
            echo "✓ Docker daemon running"
            docker info | rg "Server Version|Storage Driver|Operating System"
          else
            echo "✗ Docker daemon not responding"
            exit 1
          fi
          echo ""

          # Test container execution
          echo "Testing container execution..."
          docker run --rm alpine:latest echo "✓ Container execution works"
          echo ""

      - name: Validate Nix
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  Nix Build System"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""

          # Nix store
          if [ -d /nix/store ]; then
            echo "✓ /nix/store exists"
            STORE_SIZE=$(dust -d 0 /nix/store 2>/dev/null | tail -1 || echo "unknown")
            echo "  Size: $STORE_SIZE"
          else
            echo "✗ /nix/store not found"
            exit 1
          fi
          echo ""

          # Flake evaluation
          echo "Testing flake evaluation..."
          nix flake metadata --json | jq -r '"✓ Flake: \(.description // "no description")"'
          echo ""

          # Show available devshells
          echo "Available devShells:"
          nix flake show --json 2>/dev/null | jq -r '.devShells."x86_64-linux" | keys[]' | while read shell; do
            echo "  - $shell"
          done
          echo ""

      - name: Validate SSH
        run: |
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  SSH Configuration"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""

          # SSH key
          SSH_PUBKEY="${HOME}/.ssh/id_ed25519.pub"
          if [ -f "$SSH_PUBKEY" ]; then
            echo "✓ SSH public key: $SSH_PUBKEY"
            ssh-keygen -l -f "$SSH_PUBKEY"
          else
            echo "⚠ SSH public key not found: $SSH_PUBKEY"
            echo "  (Required for QCOW2 VM access during build)"
            echo "  Generate via cloud-init userdata or infrastructure provisioning"
          fi
          echo ""

      - name: Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════════"
          echo "  VALIDATION SUMMARY"
          echo "═══════════════════════════════════════════════════════════════════"
          echo ""
          echo "┌─────────────────────────┬──────────┐"
          echo "│ Check                   │ Status   │"
          echo "├─────────────────────────┼──────────┤"
          echo "│ Forked Runner           │ ✅ Pass  │"
          echo "│ Workspace Structure     │ ✅ Pass  │"
          echo "│ direnv Integration      │ ✅ Pass  │"
          echo "│ Required Binaries       │ ✅ Pass  │"
          echo "│ OVMF Firmware           │ ✅ Pass  │"
          echo "│ KVM Access              │ ✅ Pass  │"
          echo "│ System Resources        │ ✅ Pass  │"
          echo "│ Docker Runtime          │ ✅ Pass  │"
          echo "│ Nix Build System        │ ✅ Pass  │"
          echo "│ SSH Configuration       │ ✅ Pass  │"
          echo "└─────────────────────────┴──────────┘"
          echo ""
          echo "Runner:         $(hostname)"
          echo "Date:           $(date -Iseconds)"
          echo "WORKSPACE_ROOT: ${WORKSPACE_ROOT:-<not set>}"
          echo ""

          # Konductor provenance
          if [[ -f /.konductor ]]; then
            echo "--- Konductor Provenance (/.konductor) ---"
            cat /.konductor
            echo "-------------------------------------------"
            echo ""
          fi

          # Konductor service status
          if systemctl is-active --quiet konductor.service 2>/dev/null; then
            echo "--- Konductor Service Status ---"
            systemctl status konductor.service --no-pager 2>/dev/null | head -15
            echo "--------------------------------"
            echo ""
          fi

          echo "═══════════════════════════════════════════════════════════════════"
          echo "  ✅ All Environment Checks Passed - Ready for QCOW2 builds"
          echo "═══════════════════════════════════════════════════════════════════"
