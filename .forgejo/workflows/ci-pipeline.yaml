name: CI Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build QCOW2 + Validate
    runs-on: konductor
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build QCOW2
        run: runme run --all --tag=k9:ci:pipeline:all --filename docs/ci/build.md

      - name: Registry Trust + Login
        run: |
          runme run k9:ci:registry:trust
          runme run k9:ci:registry:login

      - name: Push to Local Registry
        run: runme run k9:ci:qcow2:push:image

      - name: Validate Deploy (from local registry)
        run: runme run k9:ci:qcow2:validate:deploy

      - name: Validate Services
        run: runme run k9:ci:qcow2:validate:services

      - name: Validate Runner
        run: runme run k9:ci:qcow2:validate:runner
