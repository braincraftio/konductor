name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.release.outputs.new_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install semantic-release
        run: >
          npm install -g
          semantic-release@25.0.9
          @semantic-release/changelog@7.0.0
          @semantic-release/git@11.0.1
          conventional-changelog-conventionalcommits@10.4.0

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release 2>&1 | tee release-output.txt
          if grep -q "Published release" release-output.txt; then
            VERSION=$(grep -oP 'Published release \K[0-9]+\.[0-9]+\.[0-9]+' release-output.txt || true)
            {
              echo "new_release=true"
              echo "version=${VERSION}"
              echo "tag=v${VERSION}"
            } >> "$GITHUB_OUTPUT"
          else
            echo "new_release=false" >> "$GITHUB_OUTPUT"
          fi

  # Build from post-release main HEAD and push to cachix.
  # Runs AFTER semantic-release commits CHANGELOG.md back to main.
  # GITHUB_TOKEN pushes do not trigger on:push workflows, so ci.yml
  # will not fire on the changelog commit. This job handles the
  # cache-aligned build that matches what consumers fetch via
  # github:braincraftio/konductor (resolves to main HEAD).
  nix-cache:
    name: Nix Cache
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release == 'true'
    uses: ./.github/workflows/nix.yml
    with:
      ref: main
    secrets:
      BCIO_CACHIX_PRIVATE_KEY: ${{ secrets.BCIO_CACHIX_PRIVATE_KEY }}
