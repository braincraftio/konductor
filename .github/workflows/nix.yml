name: Nix Build & Cache

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to triggering ref)
        required: false
        type: string
        default: ''
    secrets:
      BCIO_CACHIX_PRIVATE_KEY:
        required: false

jobs:
  build:
    name: Build ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
          # x86_64-darwin removed: nixpkgs-unstable (26.11) dropped
          # x86_64-darwin support. The unstable overlay import fails
          # with "Nixpkgs 26.11 has dropped support for x86_64-darwin"
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Actions cache disabled: nix store closure exceeds
      # GitHub's 10GB cache limit, causing ResourceExhausted rate limits.
      # Cachix is the sole binary cache for this project.
      # - uses: DeterminateSystems/magic-nix-cache-action@v14
      #   with:
      #     use-flakehub: false
      #     diagnostic-endpoint: ""

      - uses: cachix/cachix-action@v15
        with:
          name: braincraftio
          authToken: ${{ secrets.BCIO_CACHIX_PRIVATE_KEY }}

      - name: Flake checks
        run: nix flake check --accept-flake-config -L

      - name: Build outputs
        run: |
          nix build --no-link --accept-flake-config -L \
            .#packages.${{ matrix.system }}.default \
            .#devShells.${{ matrix.system }}.full

      - name: Build konductor devshell
        if: matrix.system == 'x86_64-linux'
        run: nix build --no-link --accept-flake-config -L .#devShells.${{ matrix.system }}.konductor

      - name: Build frontend devshell
        if: matrix.system == 'x86_64-linux'
        run: nix build --no-link --accept-flake-config -L .#devShells.${{ matrix.system }}.frontend
