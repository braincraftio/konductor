name: Nix Build & Cache

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to triggering ref)
        required: false
        type: string
        default: ''
    secrets:
      BCIO_CACHIX_PRIVATE_KEY:
        required: false

jobs:
  build:
    name: Build ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
          - system: x86_64-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          diagnostic-endpoint: ""

      - uses: cachix/cachix-action@v15
        with:
          name: braincraftio
          authToken: ${{ secrets.BCIO_CACHIX_PRIVATE_KEY }}

      - name: Flake checks
        run: nix flake check --accept-flake-config -L

      - name: Build outputs
        run: |
          nix build --no-link --accept-flake-config -L \
            .#packages.${{ matrix.system }}.default \
            .#devShells.${{ matrix.system }}.full

      - name: Build konductor devshell
        if: matrix.system == 'x86_64-linux'
        run: nix build --no-link --accept-flake-config -L .#devShells.${{ matrix.system }}.konductor

      - name: Build frontend devshell
        if: matrix.system == 'x86_64-linux'
        run: nix build --no-link --accept-flake-config -L .#devShells.${{ matrix.system }}.frontend
