name: Nix Build & Cache

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to triggering ref)
        required: false
        type: string
        default: ""
    secrets:
      BCIO_CACHIX_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64-darwin is not in flake supportedSystems; see flake.nix.
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # PR builds pull only; push and release builds push to both caches.
      - uses: ./.github/actions/setup-nix
        with:
          use-flakehub: ${{ github.event_name != 'pull_request' }}
          cachix-name: ${{ vars.CACHIX_NAME || 'braincraftio' }}
          cachix-auth-token: ${{ secrets.BCIO_CACHIX_PRIVATE_KEY }}
          cachix-skip-push: ${{ github.event_name == 'pull_request' }}

      - name: Flake structure
        run: nix flake show --no-update-lock-file --accept-flake-config

      - name: Flake checks
        run: nix flake check --no-update-lock-file --accept-flake-config -L

      - name: Build maintained packages
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          packages=(
            ci atuin flakehub-push k0sctl terminal-browser opencode mitogen ansible
            python-env pulumi pulumi-cli trzsz
          )
          targets=()
          for package in "${packages[@]}"; do
            targets+=(".#packages.$SYSTEM.$package")
          done
          if [[ "$SYSTEM" == *-linux ]]; then
            targets+=(".#packages.$SYSTEM.k0s")
          fi
          if [[ "$SYSTEM" == x86_64-linux ]]; then
            targets+=(".#packages.$SYSTEM.code-server")
          fi
          nix build --no-link --no-update-lock-file --keep-going --accept-flake-config -L "${targets[@]}"
          nix build --no-link --no-update-lock-file --accept-flake-config -L ".#packages.$SYSTEM.k0sctl.tests.version"

      # Exercises the documented consumer path: nix profile install.
      - name: Install default package
        run: |
          nix profile install ".#packages.${{ matrix.system }}.default" \
            --no-update-lock-file --accept-flake-config --profile "$RUNNER_TEMP/konductor" -L
          "$RUNNER_TEMP/konductor/bin/nvim" --version

      - name: Build devshells
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          targets=(".#devShells.$SYSTEM.default" ".#devShells.$SYSTEM.full")
          if [[ "$SYSTEM" == x86_64-linux ]]; then
            targets+=(".#devShells.$SYSTEM.konductor" ".#devShells.$SYSTEM.frontend")
          fi
          nix build --no-link --no-update-lock-file --keep-going --accept-flake-config -L "${targets[@]}"

      # Keep the failed build red. Each platform emits its own reviewable patch.
      - name: Repair hash mismatches
        if: failure() && github.event_name == 'pull_request'
        uses: ./.github/actions/fix-nix-hashes
        with:
          system: ${{ matrix.system }}
