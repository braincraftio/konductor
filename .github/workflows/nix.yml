name: Nix Build & Cache

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to triggering ref)
        required: false
        type: string
        default: ""
    secrets:
      BCIO_CACHIX_PRIVATE_KEY:
        required: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64-darwin is not in flake supportedSystems; see flake.nix.
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Unreviewed revisions: pull requests, and update branches whose CI
    # update.yml dispatches. Release builds are called from workflow_run.
    env:
      UNREVIEWED: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      # Unreviewed builds pull only; push and release builds push to both caches.
      - uses: ./.github/actions/setup-nix
        with:
          use-flakehub: ${{ env.UNREVIEWED != 'true' }}
          cachix-name: ${{ vars.CACHIX_NAME || 'braincraftio' }}
          cachix-auth-token: ${{ secrets.BCIO_CACHIX_PRIVATE_KEY }}
          cachix-skip-push: ${{ env.UNREVIEWED }}

      - name: Flake structure
        run: nix flake show --no-update-lock-file --accept-flake-config

      # Source build (src/overlays/atuin.nix), isolated so its link steps do not
      # run concurrently with flake-check builds. Remove with the overlay once
      # the locked nixpkgs ships atuin >= 18.24.5 (procedure in that file).
      - name: Build atuin
        env:
          SYSTEM: ${{ matrix.system }}
        run: nix build --no-link --no-update-lock-file --accept-flake-config -L ".#packages.$SYSTEM.atuin"

      # biome links with fat LTO (~8-10 GB per target, nixpkgs
      # pkgs/by-name/bi/biome/package.nix). The locked nixpkgs fork has no
      # cache.nixos.org substitute, so it builds from source, and rustc was
      # killed on the aarch64-linux runner even with the build running alone.
      # Swap gives the link headroom without changing the derivation, so the
      # store path stays identical to the devshell's and push builds cache it.
      - name: Add swap
        if: matrix.system == 'aarch64-linux'
        run: |
          free -h
          sudo fallocate -l 16G /konductor.swap
          sudo chmod 600 /konductor.swap
          sudo mkswap /konductor.swap
          sudo swapon /konductor.swap
          free -h

      - name: Build biome
        env:
          SYSTEM: ${{ matrix.system }}
        run: nix build --no-link --no-update-lock-file --accept-flake-config --max-jobs 1 -L ".#packages.$SYSTEM.biome"

      - name: Flake checks
        run: nix flake check --no-update-lock-file --accept-flake-config -L

      - name: Build maintained packages
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          packages=(
            ci flakehub-push k0sctl terminal-browser opencode mitogen ansible
            python-env pulumi pulumi-cli trzsz
          )
          targets=()
          for package in "${packages[@]}"; do
            targets+=(".#packages.$SYSTEM.$package")
          done
          if [[ "$SYSTEM" == *-linux ]]; then
            targets+=(".#packages.$SYSTEM.k0s")
          fi
          if [[ "$SYSTEM" == x86_64-linux ]]; then
            targets+=(".#packages.$SYSTEM.code-server")
          fi
          nix build --no-link --no-update-lock-file --keep-going --accept-flake-config -L "${targets[@]}"
          nix build --no-link --no-update-lock-file --accept-flake-config -L ".#packages.$SYSTEM.k0sctl.tests.version"

      # Exercises the documented consumer path: nix profile install.
      - name: Install default package
        run: |
          nix profile install ".#packages.${{ matrix.system }}.default" \
            --no-update-lock-file --accept-flake-config --profile "$RUNNER_TEMP/konductor" -L
          "$RUNNER_TEMP/konductor/bin/nvim" --version

      - name: Build devshells
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          targets=(".#devShells.$SYSTEM.default" ".#devShells.$SYSTEM.full")
          if [[ "$SYSTEM" == x86_64-linux ]]; then
            targets+=(".#devShells.$SYSTEM.konductor" ".#devShells.$SYSTEM.frontend")
          fi
          nix build --no-link --no-update-lock-file --keep-going --accept-flake-config -L "${targets[@]}"

      # Evidence for killed builds (rustc "terminated by a deadly signal"): the
      # kernel log names OOM kills explicitly.
      - name: Kernel OOM report
        if: failure() && runner.os == 'Linux'
        run: |
          free -h
          sudo dmesg --ctime | grep -iE 'out of memory|oom-kill|killed process' || echo "no OOM kill recorded"

      # Keep the failed build red. Each platform emits its own reviewable patch.
      - name: Repair hash mismatches
        if: failure() && env.UNREVIEWED == 'true'
        uses: ./.github/actions/fix-nix-hashes
        with:
          system: ${{ matrix.system }}
