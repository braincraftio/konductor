name: Deploy konductor.sh to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "www/sites/konductor.sh/**"
      - "src/lib/versions.nix"
      - ".github/workflows/pages.yaml"
      - ".github/actions/setup-nix/**"
      - ".github/actions/setup-devshell/**"
      - ".github/actions/upload-pages-artifact/**"
      - ".github/actions/deploy-pages/**"
      - "flake.nix"
      - "flake.lock"
  # The build job is the Tailwind/Astro compiler gate that stylelint delegates
  # @theme/@plugin validation to; it must pass before merge, not only on deploy.
  pull_request:
    paths:
      - "www/sites/konductor.sh/**"
      - "src/lib/versions.nix"
      - "src/config/linters/stylelint/**"
      - ".github/workflows/pages.yaml"
      - ".github/actions/setup-nix/**"
      - ".github/actions/setup-devshell/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Deploys share one group so a newer main build supersedes an older one;
# pull request builds are grouped per PR and never cancel a deploy.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request'
    && format('pages-pr-{0}', github.event.pull_request.number)
    || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # node and pnpm come from .#ci; node major follows src/lib/versions.nix.
      - uses: ./.github/actions/setup-devshell

      - name: Install dependencies
        run: pnpm -C www/sites/konductor.sh install --frozen-lockfile

      - name: Build
        run: pnpm -C www/sites/konductor.sh build

      - uses: ./.github/actions/upload-pages-artifact
        with:
          path: www/sites/konductor.sh/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page-url }}
    steps:
      # Local actions resolve from the workspace, so deploy needs a checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/actions

      - id: deployment
        uses: ./.github/actions/deploy-pages
