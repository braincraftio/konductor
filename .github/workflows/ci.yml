name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # update.yml dispatches CI on its branch: pull_request events from
  # GITHUB_TOKEN-created PRs do not start workflows. Check runs attach to the
  # branch head commit, so they gate the PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/nix.yml
    secrets:
      BCIO_CACHIX_PRIVATE_KEY: ${{ secrets.BCIO_CACHIX_PRIVATE_KEY }}
