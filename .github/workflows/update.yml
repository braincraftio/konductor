name: Update

# Weekly maintenance of flake.lock and the src/lib/versions.nix release
# records through `runme run update` (docs/developer_guide/UPDATE.md), the
# same task maintainers run locally. Changes land on the bot-owned
# update/release-records branch as one PR; CI is dispatched on that branch
# because pull_request events from GITHUB_TOKEN do not start workflows.
# GitHub Actions third-party pins are maintained by Dependabot.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: update
  cancel-in-progress: false

env:
  BRANCH: update/release-records

jobs:
  update:
    name: Update inputs and release records
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      # Unreviewed sources: pull from caches, never push.
      - uses: ./.github/actions/setup-nix
        with:
          cachix-name: ${{ vars.CACHIX_NAME || 'braincraftio' }}
          cachix-skip-push: "true"

      - uses: ./.github/actions/setup-devshell

      # GITHUB_TOKEN raises the api.github.com rate limit for nix-update and
      # update-artifacts; update-artifacts sends it only to api.github.com.
      - name: Run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git show HEAD:flake.lock > "$RUNNER_TEMP/flake.lock.orig"
          runme run update

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Inputs and release records are current" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          {
            echo "chore(deps): update flake inputs and release records"
            echo
            echo "flake.lock:"
            jq -rn --slurpfile old "$RUNNER_TEMP/flake.lock.orig" --slurpfile new flake.lock '
              $new[0].nodes | to_entries[]
              | select(.value.locked.rev != null)
              | .key as $name
              | ($old[0].nodes[$name].locked.rev // "none") as $from
              | select($from != .value.locked.rev)
              | "- \($name): \($from[0:12]) -> \(.value.locked.rev[0:12])"'
            echo
            echo "src/lib/versions.nix:"
            git diff -U0 -- src/lib/versions.nix | grep -E '^[-+][[:space:]]+(version|rev)[[:space:]]*=' || true
          } > "$RUNNER_TEMP/commit-msg.txt"
          cat "$RUNNER_TEMP/commit-msg.txt" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -- flake.lock src/lib/versions.nix src/config/formatters/prettier
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          git --no-pager show --stat HEAD

      # The branch is owned by this workflow and rebuilt from main each run.
      - name: Push and open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(deps): update flake inputs and release records" \
              --body-file "$RUNNER_TEMP/commit-msg.txt"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
