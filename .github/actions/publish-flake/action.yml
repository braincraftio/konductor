name: Publish flake
description: Publish the checked-out semantic release to FlakeHub (requires Nix and OIDC)
inputs:
  tag:
    description: Existing v-prefixed semantic release tag
    required: true
runs:
  using: composite
  steps:
    - name: Verify release checkout
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
    # The action SHA pins only the JavaScript wrapper. Its binary is the
    # flake's packages.<system>.flakehub-push, built from the same rev
    # (src/lib/versions.nix flakehub-push record), so nothing is downloaded
    # from install.determinate.systems. Bump the SHA below and that record
    # together.
    - name: Build flakehub-push
      id: flakehub-push
      shell: bash
      run: |
        out="$(nix build .#flakehub-push --no-link --print-out-paths --no-update-lock-file --accept-flake-config -L)"
        echo "binary=$out/bin/flakehub-push" >> "$GITHUB_OUTPUT"

    - name: Publish to FlakeHub
      uses: DeterminateSystems/flakehub-push@dceefcb33cba27bde28f8540d8b4537cb925c46b
      with:
        tag: ${{ inputs.tag }}
        visibility: public
        include-output-paths: true
        source-binary: ${{ steps.flakehub-push.outputs.binary }}
